<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Arrow Game — Edge-Gen Test</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f172a; color: #f1f5f9;
    font-family: 'Courier New', monospace;

    display: flex; gap: 8px; align-items: center;

  }

  select, input[type=number] {
    padding: 4px 6px; background: #1e293b; color: #f1f5f9;
    border: 1px solid #334155; border-radius: 4px;
    font-family: inherit; font-size: 12px;
  }
  button {
    padding: 6px 14px; border: none; border-radius: 4px;
    cursor: pointer; font-size: 12px; font-family: inherit; font-weight: bold;
  }
  .btn-s1 { background: #7c3aed; color: #fff; }
  .btn-s1:hover { background: #6d28d9; }
  .btn-s2 { background: #0369a1; color: #fff; }
  .btn-s2:hover { background: #0284c7; }
  .btn-s3 { background: #065f46; color: #fff; }
  .btn-s3:hover { background: #047857; }
  .btn-s4 { background: #92400e; color: #fff; }
  .btn-s4:hover { background: #b45309; }
  .btn-s5 { background: #0e7490; color: #fff; }
  .btn-s5:hover { background: #0891b2; }
  .btn-s6 { background: #6d28d9; color: #fff; }
  .btn-s6:hover { background: #7c3aed; }
  .btn-s7 { background: #166534; color: #fff; }
  .btn-s7:hover { background: #15803d; }
  .btn-s8 { background: #9f1239; color: #fff; }
  .btn-s8:hover { background: #be123c; }
  .btn-s9 { background: #1e3a5f; color: #fff; }
  .btn-s9:hover { background: #1e40af; }

  #canvasWrap { border: 1px solid #334155; background: #fff; }

  #stats {
    font-size: 11px; background: #1e293b; border: 1px solid #334155;

  }

  #legend {
    display: flex; gap: 14px; flex-wrap: wrap;

  }
  .leg { display: flex; align-items: center; gap: 5px; }

  .line { width:20px; height:4px; border-radius:2px; display:inline-block; }
</style>
</head>
<body>

<h1>ARROW GAME — EDGE-BASED GENERATION TEST</h1>

<div id="controls">
  <label>Grid:
    <select id="gridSelect">
      <option value="8,10">8 × 10</option>
      <option value="10,12">10 × 12</option>
      <option value="10,14">10 × 14</option>
      <option value="12,16">12 × 16</option>
      <option value="14,18">14 × 18</option>
      <option value="16,20">16 × 20</option>
      <option value="18,24" selected>18 × 24</option>
      <option value="20,26">20 × 26</option>
    </select>
  </label>
  <button class="btn-s1" onclick="runStep1()">Step 1: Graph + Pairing</button>
  <button class="btn-s2" onclick="runStep2()">Step 2: Trails</button>
  <button class="btn-s3" onclick="runStep3()">Step 3: Full Coverage</button>
  <button class="btn-s4" onclick="runStep4()">Step 4: Fragment</button>
  <button class="btn-s5" onclick="runStep5()">Step 5: Headings</button>
  <button class="btn-s6" onclick="runStep6()">Step 6: DAG</button>
  <button class="btn-s7" onclick="runStep7()">Step 7: Unjam</button>
  <button class="btn-s8" onclick="runStep8()">Step 8: Solvability</button>
  <button class="btn-s9" onclick="runStep9()">Step 9: Complexity</button>
  <label>Level: <input type="number" id="levelInput" value="40" min="1" max="60" style="width:52px"></label>
  <span id="genInfo" style="font-size:11px;color:#64748b">—</span>
</div>

<div id="legend">
  <div class="leg"><div class="dot" style="background:#94a3b8;border:1px solid #64748b"></div> Even node</div>
  <div class="leg"><div class="dot" style="background:#ef4444"></div> Odd node (endpoint)</div>
  <div class="leg"><div class="dot" style="background:#3b82f6"></div> Pair start</div>
  <div class="leg"><div class="dot" style="background:#22c55e"></div> Pair end</div>
  <div class="leg"><div class="line" style="background:#6b7280"></div> Free edge</div>
  <div class="leg"><div class="line" style="background:#f59e0b"></div> Reserved edge (trail)</div>
</div>

<div id="canvasWrap">
  <canvas id="testCanvas"></canvas>
</div>
<div id="stats">Press a step button to begin.</div>

<script src="js/edge-gen.js"></script>
<script src="js/edge-logic.js"></script>
<script>
// ── layout ────────────────────────────────────────────────────────────────────
const CELL = 26, PAD = 20;
const tc   = document.getElementById('testCanvas');
const ctx  = tc.getContext('2d');

// 40 distinct trail colors
const COLORS = [
  '#e63946','#f4a261','#e9c46a','#2a9d8f','#457b9d',
  '#48cae4','#7b2d8b','#f77f00','#d62828','#606c38',
  '#dda15e','#0d3b66','#1b4332','#40916c','#6d6875',
  '#b5838d','#3a0ca3','#4361ee','#7209b7','#f72585',
  '#06d6a0','#ef476f','#ffd166','#8338ec','#3a86ff',
  '#ff6b6b','#feca57','#48dbfb','#ff9ff3','#54a0ff',
  '#5f27cd','#00d2d3','#ff9f43','#ee5a24','#009432',
  '#0652dd','#9980fa','#fd9644','#e84393','#1289a7'
];

function nx(c) { return PAD + c * CELL; }
function ny(r) { return PAD + r * CELL; }

function parseGrid() {
  const v = document.getElementById('gridSelect').value.split(',');
  return { COLS: parseInt(v[0]), ROWS: parseInt(v[1]) };
}

function sizeCanvas(rows, cols) {
  tc.width  = cols * CELL + PAD * 2;
  tc.height = rows * CELL + PAD * 2;
}

// ── base grid ─────────────────────────────────────────────────────────────────
function drawBaseGrid(rows, cols) {
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, tc.width, tc.height);
  ctx.strokeStyle = '#e2e8f0';
  ctx.lineWidth = 0.5;
  for (let r = 0; r <= rows; r++) {
    ctx.beginPath(); ctx.moveTo(nx(0), ny(r)); ctx.lineTo(nx(cols), ny(r)); ctx.stroke();
  }
  for (let c = 0; c <= cols; c++) {
    ctx.beginPath(); ctx.moveTo(nx(c), ny(0)); ctx.lineTo(nx(c), ny(rows)); ctx.stroke();
  }
}

// ── STEP 1 render ─────────────────────────────────────────────────────────────
function renderStep1(rows, cols, oddSet, pairs) {
  drawBaseGrid(rows, cols);

  // Pair lines (under nodes)
  pairs.forEach((p, i) => {
    ctx.save();
    ctx.strokeStyle = COLORS[i % COLORS.length];
    ctx.lineWidth = 1.5; ctx.globalAlpha = 0.5;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(nx(p.start.c), ny(p.start.r));
    ctx.lineTo(nx(p.end.c),   ny(p.end.r));
    ctx.stroke(); ctx.setLineDash([]); ctx.restore();
  });

  // All nodes
  for (let r = 0; r <= rows; r++) {
    for (let c = 0; c <= cols; c++) {
      const isOdd = oddSet.has(r + ',' + c);
      ctx.beginPath();
      ctx.arc(nx(c), ny(r), isOdd ? 4.5 : 2.5, 0, Math.PI * 2);
      ctx.fillStyle = isOdd ? '#ef4444' : '#94a3b8';
      ctx.fill();
    }
  }

  // Pair endpoints
  pairs.forEach(p => {
    ctx.beginPath(); ctx.arc(nx(p.start.c), ny(p.start.r), 5, 0, Math.PI * 2);
    ctx.fillStyle = '#3b82f6'; ctx.fill();
    ctx.beginPath(); ctx.arc(nx(p.end.c),   ny(p.end.r),   5, 0, Math.PI * 2);
    ctx.fillStyle = '#22c55e'; ctx.fill();
  });
}

// ── STEP 2 render ─────────────────────────────────────────────────────────────
function renderStep2(rows, cols, graph, trails) {
  drawBaseGrid(rows, cols);

  const { hEdge, vEdge } = graph;

  // Draw reserved horizontal edges
  for (let r = 0; r <= rows; r++) {
    for (let c = 0; c < cols; c++) {
      const id = hEdge[r][c];
      if (id < 0) continue;
      ctx.strokeStyle = COLORS[id % COLORS.length];
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(nx(c),     ny(r));
      ctx.lineTo(nx(c + 1), ny(r));
      ctx.stroke();
    }
  }

  // Draw reserved vertical edges
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c <= cols; c++) {
      const id = vEdge[r][c];
      if (id < 0) continue;
      ctx.strokeStyle = COLORS[id % COLORS.length];
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(nx(c), ny(r));
      ctx.lineTo(nx(c), ny(r + 1));
      ctx.stroke();
    }
  }

  // Highlight free (uncovered) edges in red so they're obvious
  ctx.strokeStyle = '#ff0000';
  ctx.lineWidth = 1.5;
  for (let r = 0; r <= rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (hEdge[r][c] !== -1) continue;
      ctx.beginPath(); ctx.moveTo(nx(c), ny(r)); ctx.lineTo(nx(c+1), ny(r)); ctx.stroke();
    }
  }
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c <= cols; c++) {
      if (vEdge[r][c] !== -1) continue;
      ctx.beginPath(); ctx.moveTo(nx(c), ny(r)); ctx.lineTo(nx(c), ny(r+1)); ctx.stroke();
    }
  }

  // Trail start/end dots
  trails.forEach((t, i) => {
    const color = COLORS[i % COLORS.length];
    const s = t.nodes[0], e = t.nodes[t.nodes.length - 1];
    ctx.beginPath(); ctx.arc(nx(s.c), ny(s.r), 4, 0, Math.PI * 2);
    ctx.fillStyle = color; ctx.fill();
    ctx.beginPath(); ctx.arc(nx(e.c), ny(e.r), 4, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.stroke();
  });
}

// ── stats ─────────────────────────────────────────────────────────────────────
function showStep1Stats(rows, cols, oddNodes, pairs, ms) {
  const totalNodes = (rows+1)*(cols+1);
  const hCount = (rows+1)*cols, vCount = rows*(cols+1);
  const totalEdges = hCount + vCount;
  let minD=Infinity, maxD=0, sumD=0;
  pairs.forEach(p => {
    const d = Math.abs(p.end.r-p.start.r)+Math.abs(p.end.c-p.start.c);
    if(d<minD) minD=d; if(d>maxD) maxD=d; sumD+=d;
  });
  document.getElementById('stats').innerHTML = `
    <b>STEP 1 — ${cols}×${rows} grid</b> &nbsp;|&nbsp; ${ms}ms<br>
    Nodes: ${totalNodes} &nbsp;|&nbsp;
    hEdges: ${hCount} &nbsp;|&nbsp; vEdges: ${vCount} &nbsp;|&nbsp;
    <b>Total edges: ${totalEdges}</b><br>
    <b>Odd-degree nodes: ${oddNodes.length}</b>
    (top/bot: ${2*(cols-1)} &nbsp; left/right: ${2*(rows-1)})<br>
    <b>Pairs: ${pairs.length}</b> = minimum path count &nbsp;|&nbsp;
    pair dist: min=${minD} avg=${(sumD/pairs.length).toFixed(1)} max=${maxD}
  `;
}

function showStep2Stats(rows, cols, graph, trails, ms) {
  const totalEdges = graph.totalEdges;
  const free = countFreeEdges(graph);
  const covered = totalEdges - free;
  const pct = ((covered / totalEdges) * 100).toFixed(1);

  let minLen=Infinity, maxLen=0, sumLen=0;
  trails.forEach(t => {
    const l = t.nodes.length;
    if(l<minLen) minLen=l; if(l>maxLen) maxLen=l; sumLen+=l;
  });

  document.getElementById('stats').innerHTML = `
    <b>STEP 2 — ${cols}×${rows} grid</b> &nbsp;|&nbsp; ${ms}ms<br>
    Total edges: ${totalEdges} &nbsp;|&nbsp;
    <b>Covered: ${covered} (${pct}%)</b> &nbsp;|&nbsp;
    <span style="color:${free===0?'#22c55e':'#ef4444'}">
      Free (uncovered): ${free} ${free===0?'✓':'← Step 3 will fix'}
    </span><br>
    Trails generated: <b>${trails.length}</b> &nbsp;|&nbsp;
    Trail length: min=${minLen} avg=${(sumLen/trails.length).toFixed(1)} max=${maxLen} nodes
  `;
}

// ── step runners ──────────────────────────────────────────────────────────────
function runStep1() {
  const { COLS, ROWS } = parseGrid();
  sizeCanvas(ROWS, COLS);

  const t0    = Date.now();
  const graph = buildEdgeGraph(ROWS, COLS);
  const odd   = getOddDegreeNodes(graph);
  const pairs = pairOddNodes(odd);
  const ms    = Date.now() - t0;

  const oddSet = new Set(odd.map(n => n.r + ',' + n.c));
  renderStep1(ROWS, COLS, oddSet, pairs);
  showStep1Stats(ROWS, COLS, odd, pairs, ms);
  document.getElementById('genInfo').textContent = `Step 1 done in ${ms}ms`;
}

function runStep2() {
  const { COLS, ROWS } = parseGrid();
  sizeCanvas(ROWS, COLS);

  const t0    = Date.now();
  const graph = buildEdgeGraph(ROWS, COLS);
  const odd   = getOddDegreeNodes(graph);
  const pairs = pairOddNodes(odd);
  const { trails } = generateTrails(graph, pairs);
  const ms    = Date.now() - t0;

  renderStep2(ROWS, COLS, graph, trails);
  showStep2Stats(ROWS, COLS, graph, trails, ms);
  document.getElementById('genInfo').textContent = `Step 2 done in ${ms}ms`;
}

// ── Step 3 ────────────────────────────────────────────────────────────────────
function showStep3Stats(rows, cols, graph, allTrails, mainTrails, cleanupTrails, ms) {
  const total   = graph.totalEdges;
  const free    = countFreeEdges(graph);
  const covered = total - free;
  const ok      = free === 0;

  // Trail length breakdown
  const lenBuckets = { '2':0, '3-5':0, '6-10':0, '11+':0 };
  allTrails.forEach(t => {
    const l = t.nodes.length;
    if      (l === 2)  lenBuckets['2']++;
    else if (l <= 5)   lenBuckets['3-5']++;
    else if (l <= 10)  lenBuckets['6-10']++;
    else               lenBuckets['11+']++;
  });

  document.getElementById('stats').innerHTML = `
    <b>STEP 3 — ${cols}×${rows} grid</b> &nbsp;|&nbsp; ${ms}ms<br>
    Total edges: <b>${total}</b> &nbsp;|&nbsp;
    Covered: <b>${covered}</b> &nbsp;|&nbsp;
    Free remaining:
    <b style="color:${ok ? '#22c55e' : '#ef4444'}">
      ${free} ${ok ? '✓ ZERO — full coverage guaranteed' : '✗ BUG'}
    </b><br>
    Main trails (T-join): <b>${mainTrails.length}</b> &nbsp;|&nbsp;
    Cleanup trails: <b>${cleanupTrails.length}</b> &nbsp;|&nbsp;
    <b>Total paths: ${allTrails.length}</b><br>
    Length breakdown —
    2-node: ${lenBuckets['2']} &nbsp;
    3–5: ${lenBuckets['3-5']} &nbsp;
    6–10: ${lenBuckets['6-10']} &nbsp;
    11+: ${lenBuckets['11+']}
  `;
}

function runStep3() {
  const { COLS, ROWS } = parseGrid();
  sizeCanvas(ROWS, COLS);

  const t0    = Date.now();
  const graph = buildEdgeGraph(ROWS, COLS);
  const odd   = getOddDegreeNodes(graph);
  const pairs = pairOddNodes(odd);

  const { trails: mainTrails, nextId } = generateTrails(graph, pairs);
  const mainCount = mainTrails.length;

  const { trails: allTrails } = residualCleanup(graph, mainTrails, nextId);
  const cleanupTrails = allTrails.slice(mainCount);

  const ms = Date.now() - t0;

  // Verify assertion: zero free edges
  const freeCount = countFreeEdges(graph);
  console.assert(freeCount === 0,
    `Step 3 FAIL: ${freeCount} free edges remain on ${COLS}×${ROWS} grid`);
  if (freeCount === 0) console.log(`Step 3 PASS: all ${graph.totalEdges} edges covered on ${COLS}×${ROWS}`);

  renderStep2(ROWS, COLS, graph, allTrails); // reuse trail renderer
  showStep3Stats(ROWS, COLS, graph, allTrails, mainTrails, cleanupTrails, ms);
  document.getElementById('genInfo').textContent =
    `Step 3 done in ${ms}ms — free edges: ${freeCount}`;
}

// ── Step 4 ────────────────────────────────────────────────────────────────────

// Count turns in a full node array (used for shape classification)
function countTurns(nodes) {
  return countSegmentTurns(nodes, 0, nodes.length);
}

function classifyShape(nodes) {
  const t = countTurns(nodes);
  if (t === 0) return 'straight';
  if (t === 1) return 'L';
  if (t === 2) return 'S/Z/U';
  if (t === 3) return 'spiral';
  return 'serpentine';
}

// Draw each path as a coloured polyline along its node sequence
function renderStep4(rows, cols, paths) {
  drawBaseGrid(rows, cols);

  paths.forEach(p => {
    if (p.nodes.length < 2) return;
    const color = COLORS[p.id % COLORS.length];

    // Path body
    ctx.strokeStyle = color;
    ctx.lineWidth   = 3;
    ctx.lineJoin    = 'round';
    ctx.lineCap     = 'round';
    ctx.beginPath();
    p.nodes.forEach((n, i) => {
      i === 0 ? ctx.moveTo(nx(n.c), ny(n.r))
              : ctx.lineTo(nx(n.c), ny(n.r));
    });
    ctx.stroke();

    // Tail dot (filled circle at first node)
    const s = p.nodes[0];
    ctx.beginPath();
    ctx.arc(nx(s.c), ny(s.r), 3.5, 0, Math.PI * 2);
    ctx.fillStyle = color; ctx.fill();

    // Head indicator (white dot at last node)
    const e = p.nodes[p.nodes.length - 1];
    const pv = p.nodes[p.nodes.length - 2];
    ctx.beginPath();
    ctx.arc(nx(e.c), ny(e.r), 3.5, 0, Math.PI * 2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.stroke();

    // Small arrowhead at head
    const dx = e.c - pv.c, dy = e.r - pv.r;
    const angle = Math.atan2(dy, dx);
    const ax = nx(e.c), ay = ny(e.r), sz = 5;
    ctx.save();
    ctx.translate(ax, ay); ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(sz, 0); ctx.lineTo(-sz * 0.6, -sz * 0.5); ctx.lineTo(-sz * 0.6, sz * 0.5);
    ctx.closePath();
    ctx.fillStyle = color; ctx.fill();
    ctx.restore();
  });
}

function showStep4Stats(rows, cols, paths, level, ms) {
  const counts = { straight:0, L:0, 'S/Z/U':0, spiral:0, serpentine:0 };
  let minL = Infinity, maxL = 0, sumL = 0;

  paths.forEach(p => {
    const shape = classifyShape(p.nodes);
    counts[shape]++;
    const l = p.nodes.length;
    if (l < minL) minL = l;
    if (l > maxL) maxL = l;
    sumL += l;
  });

  const n   = paths.length;
  const avg = (sumL / n).toFixed(1);
  const pct = k => Math.round(counts[k] / n * 100);
  const bar = k => {
    const w = Math.round(counts[k] / n * 100);
    return `<span style="display:inline-block;width:${w}px;height:8px;background:currentColor;border-radius:2px;vertical-align:middle;margin-left:4px"></span>`;
  };

  document.getElementById('stats').innerHTML = `
    <b>STEP 4 — ${cols}×${rows} grid &nbsp;|&nbsp; level ${level} &nbsp;|&nbsp; ${ms}ms</b><br>
    Total paths: <b>${n}</b> &nbsp;|&nbsp;
    length: min=${minL} avg=${avg} max=${maxL} nodes<br><br>
    <span style="color:#9ca3af">Straight   </span> ${counts.straight.toString().padStart(3)} (${pct('straight')}%)${bar('straight')}<br>
    <span style="color:#3b82f6">L-shape    </span> ${counts.L.toString().padStart(3)} (${pct('L')}%)${bar('L')}<br>
    <span style="color:#10b981">S/Z/U      </span> ${counts['S/Z/U'].toString().padStart(3)} (${pct('S/Z/U')}%)${bar('S/Z/U')}<br>
    <span style="color:#f59e0b">Spiral(3t) </span> ${counts.spiral.toString().padStart(3)} (${pct('spiral')}%)${bar('spiral')}<br>
    <span style="color:#ef4444">Serpentine </span> ${counts.serpentine.toString().padStart(3)} (${pct('serpentine')}%)${bar('serpentine')}
  `;
}

function runStep4() {
  const { COLS, ROWS } = parseGrid();
  const level = parseInt(document.getElementById('levelInput').value) || 40;
  sizeCanvas(ROWS, COLS);

  const t0    = Date.now();
  const graph = buildEdgeGraph(ROWS, COLS);
  const odd   = getOddDegreeNodes(graph);
  const pairs = pairOddNodes(odd);

  const { trails: mainTrails, nextId } = generateTrails(graph, pairs);
  const { trails: allTrails }          = residualCleanup(graph, mainTrails, nextId);

  const paths = fragmentAllTrails(allTrails, level, graph);
  const ms    = Date.now() - t0;

  renderStep4(ROWS, COLS, paths);
  showStep4Stats(ROWS, COLS, paths, level, ms);
  document.getElementById('genInfo').textContent =
    `Step 4 done in ${ms}ms — ${paths.length} paths`;
}

// ── Step 5 ────────────────────────────────────────────────────────────────────

// Draw a chevron arrowhead at (x,y) pointing in the given heading direction
function drawArrowHead5(x, y, heading, sz, color) {
  const { dr, dc } = headingToDelta(heading);
  const angle = Math.atan2(dr, dc);
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.beginPath();
  ctx.moveTo(sz, 0);
  ctx.lineTo(-sz * 0.6, -sz * 0.55);
  ctx.lineTo(-sz * 0.6,  sz * 0.55);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();
}

function renderStep5(rows, cols, paths) {
  drawBaseGrid(rows, cols);

  paths.forEach(p => {
    if (p.nodes.length < 2) return;
    const color = COLORS[p.id % COLORS.length];

    // Path body
    ctx.strokeStyle = color;
    ctx.lineWidth   = 3;
    ctx.lineJoin    = 'round';
    ctx.lineCap     = 'round';
    ctx.beginPath();
    p.nodes.forEach((n, i) => {
      i === 0 ? ctx.moveTo(nx(n.c), ny(n.r))
              : ctx.lineTo(nx(n.c), ny(n.r));
    });
    ctx.stroke();

    // Tail dot at first node
    const tail = p.nodes[0];
    ctx.beginPath();
    ctx.arc(nx(tail.c), ny(tail.r), 3, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();

    // Chevron arrowhead at last node using path.heading
    const head = p.nodes[p.nodes.length - 1];
    drawArrowHead5(nx(head.c), ny(head.r), p.heading, 6, color);
  });
}

function showStep5Stats(rows, cols, paths, level, ms, graph) {
  const counts = { straight:0, L:0, 'S/Z/U':0, spiral:0, serpentine:0 };
  let selfCrash = 0;
  let minClear = Infinity, maxClear = 0, sumClear = 0;

  paths.forEach(p => {
    counts[classifyShape(p.nodes)]++;
    const head  = p.nodes[p.nodes.length - 1];
    const clear = forwardRayClearSteps(p.id, head, p.heading, graph);
    if (clear === 0) selfCrash++;
    if (clear < minClear) minClear = clear;
    if (clear > maxClear) maxClear = clear;
    sumClear += clear;
  });

  const n   = paths.length;
  const avg = (sumClear / n).toFixed(1);
  const pct = k => Math.round(counts[k] / n * 100);
  const bar = k => {
    const w = Math.round(counts[k] / n * 100);
    return `<span style="display:inline-block;width:${w}px;height:8px;background:currentColor;border-radius:2px;vertical-align:middle;margin-left:4px"></span>`;
  };

  document.getElementById('stats').innerHTML = `
    <b>STEP 5 — ${cols}×${rows} grid &nbsp;|&nbsp; level ${level} &nbsp;|&nbsp; ${ms}ms</b><br>
    Total paths: <b>${n}</b> &nbsp;|&nbsp;
    <span style="color:${selfCrash===0?'#22c55e':'#f59e0b'}">
      Self-colliding heads: <b>${selfCrash}</b>
      ${selfCrash===0 ? '✓ none — all arrowheads safe' : '(both endpoints equally constrained)'}
    </span><br>
    Clear steps ahead of head: min=${minClear} avg=${avg} max=${maxClear}<br><br>
    <span style="color:#9ca3af">Straight   </span> ${counts.straight.toString().padStart(3)} (${pct('straight')}%)${bar('straight')}<br>
    <span style="color:#3b82f6">L-shape    </span> ${counts.L.toString().padStart(3)} (${pct('L')}%)${bar('L')}<br>
    <span style="color:#10b981">S/Z/U      </span> ${counts['S/Z/U'].toString().padStart(3)} (${pct('S/Z/U')}%)${bar('S/Z/U')}<br>
    <span style="color:#f59e0b">Spiral(3t) </span> ${counts.spiral.toString().padStart(3)} (${pct('spiral')}%)${bar('spiral')}<br>
    <span style="color:#ef4444">Serpentine </span> ${counts.serpentine.toString().padStart(3)} (${pct('serpentine')}%)${bar('serpentine')}
  `;
}

function runStep5() {
  const { COLS, ROWS } = parseGrid();
  const level = parseInt(document.getElementById('levelInput').value) || 40;
  sizeCanvas(ROWS, COLS);

  const t0    = Date.now();
  const graph = buildEdgeGraph(ROWS, COLS);
  const odd   = getOddDegreeNodes(graph);
  const pairs = pairOddNodes(odd);

  const { trails: mainTrails, nextId } = generateTrails(graph, pairs);
  const { trails: allTrails }          = residualCleanup(graph, mainTrails, nextId);
  const paths = fragmentAllTrails(allTrails, level, graph);
  assignHeadings(paths, graph);
  const ms = Date.now() - t0;

  renderStep5(ROWS, COLS, paths);
  showStep5Stats(ROWS, COLS, paths, level, ms, graph);
  document.getElementById('genInfo').textContent =
    `Step 5 done in ${ms}ms — ${paths.length} paths`;
}

// ── Step 6 ────────────────────────────────────────────────────────────────────

// Depth-to-colour: 0=free(green), 1=blue, 2=amber, 3=orange, 4+=red
const DEPTH_COLORS = ['#22c55e', '#3b82f6', '#f59e0b', '#f97316', '#ef4444'];
function depthColor(d) { return DEPTH_COLORS[Math.min(d, DEPTH_COLORS.length - 1)]; }

function renderStep6(rows, cols, paths, depths) {
  drawBaseGrid(rows, cols);

  paths.forEach(p => {
    if (p.nodes.length < 2) return;
    const d     = depths[p.id] || 0;
    const color = depthColor(d);

    // Path body
    ctx.strokeStyle = color;
    ctx.lineWidth   = 3;
    ctx.lineJoin    = 'round';
    ctx.lineCap     = 'round';
    ctx.beginPath();
    p.nodes.forEach((n, i) => {
      i === 0 ? ctx.moveTo(nx(n.c), ny(n.r))
              : ctx.lineTo(nx(n.c), ny(n.r));
    });
    ctx.stroke();

    // Tail dot
    const tail = p.nodes[0];
    ctx.beginPath();
    ctx.arc(nx(tail.c), ny(tail.r), 3, 0, Math.PI * 2);
    ctx.fillStyle = color; ctx.fill();

    // Arrowhead at head using path.heading
    drawArrowHead5(nx(p.nodes[p.nodes.length - 1].c),
                   ny(p.nodes[p.nodes.length - 1].r),
                   p.heading, 6, color);
  });
}

function showStep6Stats(rows, cols, paths, level, ms, graph, freeBeforeDAG) {
  const { dep, depths, maxDepth, free, blockerRatio } = computeDAGStats(paths, graph);

  const n        = paths.length;
  const freePct  = ((free / n) * 100).toFixed(1);
  const okFree   = free / n < 0.05;
  const okDepth  = maxDepth >= 3;

  // Depth distribution
  const depBuckets = [0, 0, 0, 0, 0]; // 0,1,2,3,4+
  paths.forEach(p => {
    const d = Math.min(depths[p.id] || 0, 4);
    depBuckets[d]++;
  });
  const depBar = (i) => {
    const w = Math.round(depBuckets[i] / n * 100);
    return `<span style="display:inline-block;width:${w}px;height:8px;background:${depthColor(i)};border-radius:2px;vertical-align:middle;margin-left:4px"></span>`;
  };

  document.getElementById('stats').innerHTML = `
    <b>STEP 6 — ${cols}×${rows} grid &nbsp;|&nbsp; level ${level} &nbsp;|&nbsp; ${ms}ms</b><br>
    Total paths: <b>${n}</b> &nbsp;|&nbsp;
    Free before DAG: <b>${freeBeforeDAG}</b> (${((freeBeforeDAG/n)*100).toFixed(1)}%)
    &nbsp;→&nbsp; after: <b>${free}</b>
    <span style="color:${okFree?'#22c55e':'#f59e0b'}">(${freePct}%) ${okFree?'✓ &lt;5%':'↑ aim for &lt;5%'}</span><br>
    Max chain depth: <b style="color:${okDepth?'#22c55e':'#f59e0b'}">${maxDepth} ${okDepth?'✓ ≥3':'↑ aim for ≥3'}</b>
    &nbsp;|&nbsp; Avg blockers/path: <b>${blockerRatio.toFixed(2)}</b><br><br>
    <span style="color:${depthColor(0)}">Depth 0 (free) </span> ${depBuckets[0].toString().padStart(3)} (${Math.round(depBuckets[0]/n*100)}%)${depBar(0)}<br>
    <span style="color:${depthColor(1)}">Depth 1        </span> ${depBuckets[1].toString().padStart(3)} (${Math.round(depBuckets[1]/n*100)}%)${depBar(1)}<br>
    <span style="color:${depthColor(2)}">Depth 2        </span> ${depBuckets[2].toString().padStart(3)} (${Math.round(depBuckets[2]/n*100)}%)${depBar(2)}<br>
    <span style="color:${depthColor(3)}">Depth 3        </span> ${depBuckets[3].toString().padStart(3)} (${Math.round(depBuckets[3]/n*100)}%)${depBar(3)}<br>
    <span style="color:${depthColor(4)}">Depth 4+       </span> ${depBuckets[4].toString().padStart(3)} (${Math.round(depBuckets[4]/n*100)}%)${depBar(4)}
  `;
}

function runStep6() {
  const { COLS, ROWS } = parseGrid();
  const level = parseInt(document.getElementById('levelInput').value) || 40;
  sizeCanvas(ROWS, COLS);

  const t0    = Date.now();
  const graph = buildEdgeGraph(ROWS, COLS);
  const odd   = getOddDegreeNodes(graph);
  const pairs = pairOddNodes(odd);

  const { trails: mainTrails, nextId } = generateTrails(graph, pairs);
  const { trails: allTrails }          = residualCleanup(graph, mainTrails, nextId);
  const paths = fragmentAllTrails(allTrails, level, graph);
  assignHeadings(paths, graph);

  // Count free paths before DAG construction
  const depBefore   = buildDAGDep(paths, graph);
  const freeBeforeDAG = paths.filter(p => depBefore[p.id].size === 0).length;

  buildDAGHeadings(paths, graph);
  const ms = Date.now() - t0;

  const { depths } = computeDAGStats(paths, graph);

  renderStep6(ROWS, COLS, paths, depths);
  showStep6Stats(ROWS, COLS, paths, level, ms, graph, freeBeforeDAG);
  document.getElementById('genInfo').textContent =
    `Step 6 done in ${ms}ms — ${paths.length} paths`;
}

// ── Step 7 ────────────────────────────────────────────────────────────────────

function buildOneBoardForStep7(ROWS, COLS, level) {
  const graph = buildEdgeGraph(ROWS, COLS);
  const odd   = getOddDegreeNodes(graph);
  const pairs = pairOddNodes(odd);
  const { trails: mainTrails, nextId } = generateTrails(graph, pairs);
  const { trails: allTrails }          = residualCleanup(graph, mainTrails, nextId);
  const paths = fragmentAllTrails(allTrails, level, graph);
  assignHeadings(paths, graph);
  buildDAGHeadings(paths, graph);
  return { paths, graph };
}

function runStep7() {
  const { COLS, ROWS } = parseGrid();
  const level = parseInt(document.getElementById('levelInput').value) || 40;
  sizeCanvas(ROWS, COLS);

  const BATCH = 100;
  let neededUnjam = 0;   // boards that had stuck paths before unjamming
  let fullyFixed  = 0;   // of those, fully resolved by unjammer
  let stillStuck  = 0;   // boards with stuck paths even after unjamming
  let totalFlips  = 0;   // total heading flips applied across all boards

  const t0 = Date.now();

  let displayPaths, displayGraph, displayDepths;

  for (let b = 0; b < BATCH; b++) {
    const { paths, graph } = buildOneBoardForStep7(ROWS, COLS, level);

    const stuckBefore = countStuckPaths(paths, graph);

    // Count flips by comparing headings before/after
    const headingsBefore = paths.map(p => p.heading);
    runUnjammingPass(paths, graph);
    let flips = 0;
    paths.forEach((p, i) => { if (p.heading !== headingsBefore[i]) flips++; });
    totalFlips += flips;

    const stuckAfter = countStuckPaths(paths, graph);

    if (stuckBefore > 0) {
      neededUnjam++;
      if (stuckAfter === 0) fullyFixed++;
      else stillStuck++;
    }

    // Keep first board for display
    if (b === 0) {
      displayPaths  = paths;
      displayGraph  = graph;
      displayDepths = computeDAGStats(paths, graph).depths;
    }
  }

  const ms = Date.now() - t0;

  // Render the first board (after unjamming) using depth-colour scheme
  renderStep6(ROWS, COLS, displayPaths, displayDepths);

  const stuckAfterFirst = countStuckPaths(displayPaths, displayGraph);
  const n = displayPaths.length;

  document.getElementById('stats').innerHTML = `
    <b>STEP 7 — ${COLS}×${ROWS} grid &nbsp;|&nbsp; level ${level} &nbsp;|&nbsp; ${ms}ms (${BATCH} boards)</b><br>
    <b>Batch results:</b><br>
    Boards needing unjamming: <b>${neededUnjam}/${BATCH}</b>
    (${((neededUnjam/BATCH)*100).toFixed(0)}% had deadlocks before unjam)<br>
    Of those, fully resolved: <b style="color:${fullyFixed===neededUnjam?'#22c55e':'#f59e0b'}">${fullyFixed}/${neededUnjam}</b>
    &nbsp;|&nbsp; Still stuck after: <b style="color:${stillStuck===0?'#22c55e':'#ef4444'}">${stillStuck}</b><br>
    Total heading flips applied: <b>${totalFlips}</b>
    (avg ${(totalFlips/BATCH).toFixed(1)}/board)<br><br>
    <b>Board #1 (displayed):</b>
    ${n} paths &nbsp;|&nbsp;
    Stuck after unjam:
    <b style="color:${stuckAfterFirst===0?'#22c55e':'#ef4444'}">${stuckAfterFirst} ${stuckAfterFirst===0?'✓ fully solvable':''}</b>
  `;

  document.getElementById('genInfo').textContent =
    `Step 7 done in ${ms}ms — ${BATCH} boards`;
}

// ── Step 8 ────────────────────────────────────────────────────────────────────

function runStep8() {
  const { COLS, ROWS } = parseGrid();
  const level  = parseInt(document.getElementById('levelInput').value) || 40;
  const BATCH  = 50;
  sizeCanvas(ROWS, COLS);

  let passBeforeUnjam = 0;
  let passAfterUnjam  = 0;
  let failAfterUnjam  = 0;
  let stuckTotalBefore = 0;
  let stuckTotalAfter  = 0;

  const t0 = Date.now();
  let displayPaths, displayGraph, displayDepths;

  for (let b = 0; b < BATCH; b++) {
    const graph = buildEdgeGraph(ROWS, COLS);
    const odd   = getOddDegreeNodes(graph);
    const pairs = pairOddNodes(odd);

    const { trails: mainTrails, nextId } = generateTrails(graph, pairs);
    const { trails: allTrails }          = residualCleanup(graph, mainTrails, nextId);
    const paths = fragmentAllTrails(allTrails, level, graph);
    assignHeadings(paths, graph);
    buildDAGHeadings(paths, graph);

    const stuckBefore = countStuckPaths(paths, graph);
    stuckTotalBefore += stuckBefore;
    if (stuckBefore === 0) passBeforeUnjam++;

    runUnjammingPass(paths, graph);

    const stuckAfter = countStuckPaths(paths, graph);
    stuckTotalAfter += stuckAfter;
    if (isBoardFullySolvable(paths, graph)) passAfterUnjam++;
    else failAfterUnjam++;

    if (b === 0) {
      displayPaths  = paths;
      displayGraph  = graph;
      displayDepths = computeDAGStats(paths, graph).depths;
    }
  }

  const ms = Date.now() - t0;
  const passAfterPct  = ((passAfterUnjam  / BATCH) * 100).toFixed(0);
  const passBeforePct = ((passBeforeUnjam / BATCH) * 100).toFixed(0);
  const allPass       = failAfterUnjam === 0;

  // Render board #1 — colour by solvability: green if solved, red if stuck
  // For display we show depth colours from step 6
  renderStep6(ROWS, COLS, displayPaths, displayDepths);

  // Highlight any stuck paths in board #1 in red
  const board1Stuck = countStuckPaths(displayPaths, displayGraph);
  if (board1Stuck > 0) {
    // Re-simulate to find which specific paths are stuck and overlay in red
    const clearedSim = new Set();
    const activeIds  = new Set(displayPaths.map(p => p.id));
    let resolved = true;
    while (resolved) {
      resolved = false;
      for (const p of displayPaths) {
        if (!activeIds.has(p.id)) continue;
        if (canEscapeEdge(p, clearedSim, displayGraph)) {
          clearedSim.add(p.id);
          activeIds.delete(p.id);
          resolved = true;
          break;
        }
      }
    }
    // Draw stuck paths in flashing red overlay
    displayPaths.forEach(p => {
      if (!activeIds.has(p.id) || p.nodes.length < 2) return;
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth   = 5;
      ctx.lineJoin    = 'round';
      ctx.lineCap     = 'round';
      ctx.globalAlpha = 0.7;
      ctx.beginPath();
      p.nodes.forEach((n, i) => {
        i === 0 ? ctx.moveTo(nx(n.c), ny(n.r)) : ctx.lineTo(nx(n.c), ny(n.r));
      });
      ctx.stroke();
      ctx.globalAlpha = 1;
    });
  }

  document.getElementById('stats').innerHTML = `
    <b>STEP 8 — ${COLS}×${ROWS} grid &nbsp;|&nbsp; level ${level} &nbsp;|&nbsp; ${ms}ms (${BATCH} boards)</b><br>
    Solvable <i>before</i> unjamming: <b>${passBeforeUnjam}/${BATCH}</b> (${passBeforePct}%)<br>
    Solvable <i>after</i>  unjamming:
    <b style="color:${allPass?'#22c55e':'#ef4444'}">${passAfterUnjam}/${BATCH} (${passAfterPct}%)
    ${allPass ? '✓ 100% — target met' : '✗ target is 100%'}</b><br>
    Boards still failing after unjam:
    <b style="color:${failAfterUnjam===0?'#22c55e':'#ef4444'}">${failAfterUnjam}</b>
    &nbsp;|&nbsp;
    Avg stuck paths before: ${(stuckTotalBefore/BATCH).toFixed(1)}
    → after: ${(stuckTotalAfter/BATCH).toFixed(1)}<br><br>
    <b>Board #1:</b> ${displayPaths.length} paths &nbsp;|&nbsp;
    Stuck: <b style="color:${board1Stuck===0?'#22c55e':'#ef4444'}">${board1Stuck}
    ${board1Stuck===0 ? '✓ fully solvable' : '← shown in red above'}</b>
  `;

  document.getElementById('genInfo').textContent =
    `Step 8 done in ${ms}ms — ${BATCH} boards`;
}

// ── Step 9 ────────────────────────────────────────────────────────────────────

const TIER_COLOR = {
  EASY:   '#22c55e',
  NORMAL: '#3b82f6',
  HARD:   '#f59e0b',
  EXPERT: '#f97316',
  TITAN:  '#ef4444'
};

function buildOneBoardFull(ROWS, COLS, level) {
  const graph = buildEdgeGraph(ROWS, COLS);
  const odd   = getOddDegreeNodes(graph);
  const pairs = pairOddNodes(odd);
  const { trails: mainTrails, nextId } = generateTrails(graph, pairs);
  const { trails: allTrails }          = residualCleanup(graph, mainTrails, nextId);
  const paths = fragmentAllTrails(allTrails, level, graph);
  assignHeadings(paths, graph);
  buildDAGHeadings(paths, graph);
  runUnjammingPass(paths, graph);
  return { paths, graph };
}

function runStep9() {
  const { COLS, ROWS } = parseGrid();
  const level    = parseInt(document.getElementById('levelInput').value) || 40;
  const BATCH    = 20;   // boards at current level
  const SWEEP_N  = 5;    // boards per sweep level
  const SWEEP_LEVELS = [1, 10, 20, 40, 60];
  sizeCanvas(ROWS, COLS);

  const t0 = Date.now();

  // ── Batch at current level ──────────────────────────────────────────────────
  let scores = [], tiers = { EASY:0, NORMAL:0, HARD:0, EXPERT:0, TITAN:0 };
  let passThreshold = 0, failThreshold = 0;
  const minScore = getMinScoreForLevel(level);
  let displayPaths, displayGraph, displayDepths;

  for (let b = 0; b < BATCH; b++) {
    const { paths, graph } = buildOneBoardFull(ROWS, COLS, level);
    const cx = evaluateBoardComplexity(paths, graph);
    scores.push(cx.score);
    tiers[cx.tier]++;
    if (cx.score >= minScore) passThreshold++;
    else failThreshold++;
    if (b === 0) {
      displayPaths  = paths;
      displayGraph  = graph;
      displayDepths = computeDAGStats(paths, graph).depths;
    }
  }

  const avgScore = scores.reduce((a,b) => a+b, 0) / scores.length;
  const minS     = Math.min(...scores).toFixed(1);
  const maxS     = Math.max(...scores).toFixed(1);

  // ── Level sweep ─────────────────────────────────────────────────────────────
  const sweepResults = [];
  for (const lv of SWEEP_LEVELS) {
    let sweepScores = [];
    for (let b = 0; b < SWEEP_N; b++) {
      const { paths, graph } = buildOneBoardFull(ROWS, COLS, lv);
      const cx = evaluateBoardComplexity(paths, graph);
      sweepScores.push(cx.score);
    }
    const avg = sweepScores.reduce((a,b) => a+b, 0) / sweepScores.length;
    sweepResults.push({ lv, avg, tier: getDifficultyTier(avg) });
  }

  const ms = Date.now() - t0;

  // ── Render board #1 ─────────────────────────────────────────────────────────
  renderStep6(ROWS, COLS, displayPaths, displayDepths);

  // ── Tier bar for current level ───────────────────────────────────────────────
  const tierBar = Object.entries(tiers).map(([t, n]) => {
    const w = Math.round(n / BATCH * 100);
    return `<span style="color:${TIER_COLOR[t]}">${t} ${n}</span>
            <span style="display:inline-block;width:${w}px;height:8px;background:${TIER_COLOR[t]};border-radius:2px;vertical-align:middle;margin-left:4px;margin-right:8px"></span>`;
  }).join('');

  // ── Sweep table ─────────────────────────────────────────────────────────────
  const sweepRows = sweepResults.map(r =>
    `<span style="color:#94a3b8">Lv ${String(r.lv).padStart(2)} </span>` +
    `<span style="color:${TIER_COLOR[r.tier]}">${r.avg.toFixed(1).padStart(5)} — ${r.tier}</span>`
  ).join('<br>');

  const cx1 = evaluateBoardComplexity(displayPaths, displayGraph);

  document.getElementById('stats').innerHTML = `
    <b>STEP 9 — ${COLS}×${ROWS} grid &nbsp;|&nbsp; level ${level} &nbsp;|&nbsp; ${ms}ms</b><br>
    <b>Board #1:</b> score <b style="color:${TIER_COLOR[cx1.tier]}">${cx1.score.toFixed(1)}</b>
    → <b style="color:${TIER_COLOR[cx1.tier]}">${cx1.tier}</b>
    &nbsp;|&nbsp; maxDepth=${cx1.maxDepth}
    &nbsp;|&nbsp; blockerRatio=${cx1.blockerRatio.toFixed(2)}
    &nbsp;|&nbsp; freeRatio=${(cx1.freeRatio*100).toFixed(0)}%<br>
    Min threshold for level ${level}: <b>${minScore}</b>
    &nbsp;→&nbsp;
    <span style="color:${failThreshold===0?'#22c55e':'#f59e0b'}">
      ${passThreshold}/${BATCH} boards pass ${failThreshold===0?'✓':''}
    </span><br><br>
    <b>${BATCH} boards at level ${level}:</b>
    score min=${minS} avg=${avgScore.toFixed(1)} max=${maxS}<br>
    ${tierBar}<br><br>
    <b>Level sweep (avg score, ${SWEEP_N} boards each):</b><br>
    ${sweepRows}
  `;

  document.getElementById('genInfo').textContent =
    `Step 9 done in ${ms}ms — ${BATCH + SWEEP_LEVELS.length * SWEEP_N} boards`;
}

// Auto-run Step 1 on load
runStep1();
</script>
