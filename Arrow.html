                    let pyramidSize = Math.max(3.0, cSize * 0.32);
                    drawChevronArrowHead(headPos.x, headPos.y, p.heading, pyramidSize, isSelected, p.state);
                }
            });

            ctx.restore(); // end board clip

            // 3. Render Confetti/Victory Particles
            State.particles = State.particles.filter(pt => {
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.alpha -= pt.decay;
                if (pt.alpha <= 0) return false;
                ctx.save();
                ctx.globalAlpha = pt.alpha;
                ctx.fillStyle = pt.color;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                return true;
            });

            ctx.restore();
        }

        function animationUpdateTick() {
            State.animatingCount = 0;

            State.paths.forEach(p => {
                if (p.state === "MOVING") {
                    State.animatingCount++;
                    p.animProgress += 0.26;

                    let head = p.points[p.points.length - 1];
                    let dr = 0, dc = 0;
                    if (p.heading === "UP") dr = -1;
                    if (p.heading === "DOWN") dr = 1;
                    if (p.heading === "LEFT") dc = -1;
                    if (p.heading === "RIGHT") dc = 1;

                    let leadingGridR = Math.round(head.r + dr * p.animProgress);
                    let leadingGridC = Math.round(head.c + dc * p.animProgress);

                    if (leadingGridR >= 0 && leadingGridR < State.gridRows && leadingGridC >= 0 && leadingGridC < State.gridCols) {
                        let hit = State.paths.some(other => {
                            if (other.id === p.id || other.state === "CLEARED" || other.state === "MOVING") return false;
                            let occupied = getPathOccupiedCells(other);
                            return occupied.some(opt => opt.r === leadingGridR && opt.c === leadingGridC);
                        });

                        // Only structural obstacle blocks block escapes now!
                        let hitWall = (State.gridMask[leadingGridR]?.[leadingGridC] === -1);

                        if (hit || hitWall) {
                            p.state = "CRASHING";
                            p.crashFlashFrames = 8;
                            AudioEngine.crash();
                            triggerCameraShake();
                            processFailurePenalty();
                        }
                    }

                    if (p.animProgress > Math.max(State.gridRows, State.gridCols) * 1.5) {
                        p.state = "CLEARED";
                        AudioEngine.clear();

                        // AWARD POINTS: +10 pts on successful clearance
                        State.score += 10;
                        Persistence.saveState();

                        updateDomUI();
                        checkVictoryConditionStates();
                    }
                } else if (p.state === "CRASHING") {
                    State.animatingCount++;
                    if ((p.crashFlashFrames || 0) > 0) {
                        p.crashFlashFrames--;
                    } else {
                        p.animProgress -= 0.16;
                        if (p.animProgress <= 0) {
                            p.animProgress = 0;
                            p.state = "IDLE";
                        }
                    }
                }
            });

            drawEngine();
            requestAnimationFrame(animationUpdateTick);
        }

        // Helper: Converts Touch/Mouse Client Coordinates through Camera Transforms
        function getCanvasCoords(clientX, clientY) {
            // Use board container (untransformed) as the reference rect.
            // CSS matrix(s,0,0,s,matE,matF) with transform-origin:0 0 maps
            // canvas pixel (cx,cy) → screen (boardLeft + s*cx + matE, boardTop + s*cy + matF).
            // Inverse: cx = (screenX - boardLeft - matE) / s
            const boardBcr = document.getElementById('board-container').getBoundingClientRect();
            const canvasX = (clientX - boardBcr.left - State.matE) / State.cssZoom;
            const canvasY = (clientY - boardBcr.top - State.matF) / State.cssZoom;
            return { x: canvasX, y: canvasY };
        }

        // Multi-touch gestures (pinch zooms like an image)
        let touchMode = "none"; // "none", "pan", "pinch"
        let lastTouchX1 = 0, lastTouchY1 = 0;
        let startTouchDistance = 0;
        let startZoom = 1.0;
        let pinchAnchorX = 0, pinchAnchorY = 0; // canvas-space point fixed under finger midpoint
        let touchStartCoords = { x: 0, y: 0 };
        let touchStartClientX = 0, touchStartClientY = 0;
        let touchStartTime = 0;
        let ignoreTap = false;

        canvas.addEventListener('touchstart', (e) => {
            AudioEngine.init();
            if (State.isWinState || State.isFailState) return;

            const now = Date.now();

            if (e.touches.length === 1) {
                ignoreTap = false;
                touchMode = "pan";
                // Store raw clientX/Y — delta computation cancels the offset
                lastTouchX1 = e.touches[0].clientX;
                lastTouchY1 = e.touches[0].clientY;

                touchStartCoords = getCanvasCoords(e.touches[0].clientX, e.touches[0].clientY);
                touchStartClientX = e.touches[0].clientX;
                touchStartClientY = e.touches[0].clientY;
                touchStartTime = now;
            } else if (e.touches.length === 2) {
                touchMode = "pinch";

                const boardBcr = document.getElementById('board-container').getBoundingClientRect();
                const t1x = e.touches[0].clientX - boardBcr.left;
                const t1y = e.touches[0].clientY - boardBcr.top;
                const t2x = e.touches[1].clientX - boardBcr.left;
                const t2y = e.touches[1].clientY - boardBcr.top;

                startTouchDistance = Math.hypot(t1x - t2x, t1y - t2y);
                startZoom = State.cssZoom;
                const midX = (t1x + t2x) / 2;
                const midY = (t1y + t2y) / 2;
                pinchAnchorX = (midX - State.matE) / State.cssZoom;
                pinchAnchorY = (midY - State.matF) / State.cssZoom;
            }
            e.preventDefault();
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            if (State.isWinState || State.isFailState) return;

            if (e.touches.length === 1 && touchMode === "pan") {
                // Raw clientX/Y delta — no bcr offset needed, it cancels in the subtraction
                const dx = e.touches[0].clientX - lastTouchX1;
                const dy = e.touches[0].clientY - lastTouchY1;
                lastTouchX1 = e.touches[0].clientX;
                lastTouchY1 = e.touches[0].clientY;

                State.matE += dx;
                State.matF += dy;
                applyBoardTransform();

            } else if (e.touches.length === 2 && touchMode === "pinch") {
                const boardBcr = document.getElementById('board-container').getBoundingClientRect();
                const t1x = e.touches[0].clientX - boardBcr.left;
                const t1y = e.touches[0].clientY - boardBcr.top;
                const t2x = e.touches[1].clientX - boardBcr.left;
                const t2y = e.touches[1].clientY - boardBcr.top;

                const currentDist = Math.hypot(t1x - t2x, t1y - t2y);
                if (startTouchDistance > 0 && currentDist > 0) {
                    const newZoom = Math.min(6.0, Math.max(1.0, startZoom * currentDist / startTouchDistance));
                    const midX = (t1x + t2x) / 2;
                    const midY = (t1y + t2y) / 2;
                    State.cssZoom = newZoom;
                    State.matE = midX - newZoom * pinchAnchorX;
                    State.matF = midY - newZoom * pinchAnchorY;
                    applyBoardTransform();
                }
            }
            e.preventDefault();
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            if (State.isWinState || State.isFailState) return;

            const now = Date.now();

            if (touchMode === "pan") {
                let duration = now - touchStartTime;

                const released = e.changedTouches[0];
                let distMoved = Math.hypot(released.clientX - touchStartClientX, released.clientY - touchStartClientY);

                if (!ignoreTap && duration < 250 && distMoved < 15) {
                    const cSize = State.cellSize;
                    let clickedR = Math.floor((touchStartCoords.y - State.offsetY) / cSize);
                    let clickedC = Math.floor((touchStartCoords.x - State.offsetX) / cSize);

                    let selected = State.paths.find(p => {
                        if (p.state !== "IDLE") return false;
                        return p.points.some(pt => pt.r === clickedR && pt.c === clickedC);
                    });

                    if (selected) {
                        AudioEngine.tap();
                        selected.state = "MOVING";
                    }
                }
            }

            if (e.touches.length === 0) {
                touchMode = "none";
            } else if (e.touches.length === 1) {
                touchMode = "pan";
                lastTouchX1 = e.touches[0].clientX;
                lastTouchY1 = e.touches[0].clientY;
            }
            e.preventDefault();
        }, { passive: false });

        // Mouse Controls (Includes Scroll Zoom and Drag Pan)
        let isMouseDown = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        let mouseDownCoords = { x: 0, y: 0 };
        let mouseDownTime = 0;

        canvas.addEventListener('mousedown', (e) => {
            AudioEngine.init();
            if (State.isWinState || State.isFailState) return;

            isMouseDown = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
            mouseDownCoords = getCanvasCoords(lastMouseX, lastMouseY);
            mouseDownTime = Date.now();
        });

        canvas.addEventListener('mousemove', (e) => {
            if (State.isWinState || State.isFailState) return;

            const coords = getCanvasCoords(e.clientX, e.clientY);
            const cSize = State.cellSize;
            let hoveredR = Math.floor((coords.y - State.offsetY) / cSize);
            let hoveredC = Math.floor((coords.x - State.offsetX) / cSize);

            // Highlight path under cursor
            let hovered = State.paths.find(p => {
                if (p.state !== "IDLE") return false;
                return p.points.some(pt => pt.r === hoveredR && pt.c === hoveredC);
            });
            State.selectedPath = hovered || null;

            if (isMouseDown) {
                // Dragging pans the board
                let dx = e.clientX - lastMouseX;
                let dy = e.clientY - lastMouseY;
                State.matE += dx;
                State.matF += dy;
                applyBoardTransform();
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (isMouseDown) {
                isMouseDown = false;
                // Click triggers vector move
                if (Date.now() - mouseDownTime < 250) {
                    const cSize = State.cellSize;
                    let clickedR = Math.floor((mouseDownCoords.y - State.offsetY) / cSize);
                    let clickedC = Math.floor((mouseDownCoords.x - State.offsetX) / cSize);

                    let selected = State.paths.find(p => {
                        if (p.state !== "IDLE") return false;
                        return p.points.some(pt => pt.r === clickedR && pt.c === clickedC);
                    });

                    if (selected) {
                        AudioEngine.tap();
                        selected.state = "MOVING";
                    }
                }
            }
        });

        // Premium Mouse Wheel Zoom (Scrolls directly into the cursor point)
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (State.isWinState || State.isFailState) return;

            const boardBcr = document.getElementById('board-container').getBoundingClientRect();
            const relX = e.clientX - boardBcr.left;
            const relY = e.clientY - boardBcr.top;
            const anchorX = (relX - State.matE) / State.cssZoom;
            const anchorY = (relY - State.matF) / State.cssZoom;

            const zoomSpeed = 0.1;
            const newZoom = e.deltaY < 0
                ? Math.min(6.0, State.cssZoom * (1 + zoomSpeed))
                : Math.max(1.0, State.cssZoom * (1 - zoomSpeed));

            State.cssZoom = newZoom;
            State.matE = relX - newZoom * anchorX;
            State.matF = relY - newZoom * anchorY;
            applyBoardTransform();
        }, { passive: false });

        const actions = {
            cycleMatrixSize() {
                // Cycle Sizing preset modes: Auto -> Standard (8x8) -> Grand (14x14) -> Colossal (20x20) -> Titan (30x30) -> Cosmic (50x50)
                let idx = SIZING_PRESETS.indexOf(State.gridSizePreset);
                let nextIdx = (idx + 1) % SIZING_PRESETS.length;
                State.gridSizePreset = SIZING_PRESETS[nextIdx];
                build100PackedLevel(true);
            },
            triggerNextLevel() {
                State.level++;
                document.getElementById('win-overlay').classList.add('opacity-0', 'pointer-events-none', 'scale-105');
                State.isWinState = false;
                State.isFailState = false;
                State.hintPathId = null;
                State.selectedPath = null;
                State.particles = [];
                State.animatingCount = 0;

                Persistence.clearState();
                try {
                    build100PackedLevel(true);
                } catch (e) {
                    console.error("Level generation error, retrying with safe defaults:", e);
                    // Emergency fallback: force a simple 6x6 square board
                    State.gridSizePreset = "Standard";
                    State.shapeName = "Square Matrix";
                    State.gridRows = 6;
                    State.gridCols = 6;
                    State.gridSize = 6;
                    State.gridMask = TOPOLOGIES.SQUARE.makeMask(6, 6);
                    resetCamera();
                    resizeCanvas();
                    let result = tryGenerateBoard();
                    if (result && result.paths && result.paths.length > 0) {
                        runUnjammingSolvabilityTweak(result.paths, 6, 6, result.gridOwnership);
                        State.paths = result.paths;
                    }
                    State.lives = 3;
                    updateDomUI();
                }
            },
            retryCurrentLevel() {
                State.score = State.dailyPuzzleMode ? State.dailyPuzzleScoreAtStart : State.levelStartScore;
                State.lives = 3;
                document.getElementById('fail-overlay').classList.add('opacity-0', 'pointer-events-none', 'scale-105');
                State.isFailState = false;

                State.paths.forEach(p => {
                    p.state = "IDLE";
                    p.animProgress = 0;
                });
                State.hintPathId = null;
                State.selectedPath = null;

                resetCamera();
                if (!State.dailyPuzzleMode) Persistence.saveState();
                updateDomUI();
            },
            skipLevel() {
                if (State.animatingCount > 0) return;
                build100PackedLevel(true);
            },
            useHint() {
                if (State.isWinState || State.isFailState) return;
                let clearPaths = getUnblockedPaths();
                if (clearPaths.length > 0) {
                    State.hintPathId = clearPaths[Math.floor(Math.random() * clearPaths.length)].id;
                    AudioEngine.playTone(880.00, 'sine', 0.15, 0.08);
                } else {
                    let remaining = State.paths.filter(p => p.state === "IDLE");
                    if (remaining.length > 0) State.hintPathId = remaining[0].id;
                }
            }
        };

        function triggerCameraShake() {
            const container = document.getElementById('board-container');
            container.classList.add('shake');
            setTimeout(() => container.classList.remove('shake'), 400);
        }

        function processFailurePenalty() {
            State.lives--;
            Persistence.saveState();
            updateDomUI();
            if (State.lives <= 0) {
                State.isFailState = true;
                setTimeout(() => {
                    document.getElementById('fail-overlay').classList.remove('opacity-0', 'pointer-events-none', 'scale-105');
                }, 500);
            }
        }

        function checkVictoryConditionStates() {
            // Guard: Must have at least 1 path to win (prevents false-win from empty boards)
            if (State.paths.length === 0) return;
            let remains = State.paths.some(p => p.state !== "CLEARED");
            if (!remains && !State.isWinState) {
                State.isWinState = true;
                AudioEngine.win();
                spawnWinExplosionParticles();

                // AWARD BONUS: +100 bonus pts on clear!
                State.score += 100;
                updateDomUI();

                if (State.dailyPuzzleMode) {
                    // Daily puzzle win: save best score, show daily result overlay
                    const earned = State.score - State.dailyPuzzleScoreAtStart;
                    const existing = DailyPuzzle.load();
                    const attempts = (existing ? existing.attempts : 0) + 1;
                    const bestScore = existing ? Math.max(existing.bestScore || 0, earned) : earned;
                    DailyPuzzle.save({ bestScore, attempts });

                    document.getElementById('daily-result-date').innerText = DailyPuzzle.getTodayFormatted();
                    document.getElementById('daily-result-earned').innerText = `+${earned} pts`;
                    document.getElementById('daily-result-best').innerText =
                        attempts > 1 ? `Best today: ${bestScore} pts · Attempt ${attempts}` : `First solve today!`;

                    setTimeout(() => {
                        document.getElementById('daily-result-overlay').classList.remove('hidden');
                    }, 700);
                } else {
                    Persistence.clearState();

                    const quotes = [
                        "All long vector corridors have been cleared!",
                        "Unrivaled spatial analysis!",
                        "The lanes slide free flawlessly.",
                        "An elegant untangle solution!",
                        "The white board is empty!"
                    ];
                    document.getElementById('win-quote').innerText = `"${quotes[Math.floor(Math.random() * quotes.length)]}"`;

                    setTimeout(() => {
                        document.getElementById('win-overlay').classList.remove('opacity-0', 'pointer-events-none', 'scale-105');
                    }, 600);
                }
            }
        }

        function spawnWinExplosionParticles() {
            const colors = ["#8b5cf6", "#3b82f6", "#10b981", "#f59e0b", "#ec4899"];
            const pCount = 75;
            const originX = State.offsetX + (State.gridCols * State.cellSize) / 2;
            const originY = State.offsetY + (State.gridRows * State.cellSize) / 2;
            for (let i = 0; i < pCount; i++) {
                State.particles.push({
                    x: originX,
                    y: originY,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    size: 2 + Math.random() * 3,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1,
                    decay: 0.015 + Math.random() * 0.015
                });
            }
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
            drawEngine();
        });

        // ── Daily Puzzle ──────────────────────────────────────────────────────────

        function mulberry32(seed) {
            return function () {
                seed |= 0;
                seed = seed + 0x6D2B79F5 | 0;
                let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
                t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }

        function getDailyPuzzleSeed() {
            const d = new Date();
            return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
        }

        const DailyPuzzle = {
            storageKey: 'vecto_daily_puzzle_v1',
            getTodayStr() {
                const d = new Date();
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            },
            getTodayFormatted() {
                return new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
            },
            load() {
                try {
                    const raw = localStorage.getItem(this.storageKey);
                    if (!raw) return null;
                    const data = JSON.parse(raw);
                    return data.date === this.getTodayStr() ? data : null;
                } catch (e) { return null; }
            },
            save(data) {
                try {
                    localStorage.setItem(this.storageKey, JSON.stringify({ date: this.getTodayStr(), ...data }));
                } catch (e) { }
            }
        };

        function initDailySplash() {
            // Daily puzzle card
            const today = DailyPuzzle.load();
            document.getElementById('daily-date-display').innerText = DailyPuzzle.getTodayFormatted();
            if (today && today.bestScore !== undefined) {
                document.getElementById('daily-best-display').innerText = `Best today: ${today.bestScore} pts`;
                document.getElementById('daily-play-btn').innerText = 'Play Again →';
            } else {
                document.getElementById('daily-best-display').innerText = "Fresh puzzle — no attempts yet";
                document.getElementById('daily-play-btn').innerText = 'Play Today\'s Puzzle →';
            }

            // Level play card — peek at saved state without loading into State
            try {
                const raw = localStorage.getItem('vecto_colossal_mosaic_save_v2');
                if (raw) {
                    const saved = JSON.parse(raw);
                    document.getElementById('level-play-status').innerText = `Level ${saved.level || 1}`;
                    document.getElementById('level-play-score').innerText = `${saved.score || 0} pts · continue where you left off`;
                } else {
                    document.getElementById('level-play-status').innerText = 'Start Fresh';
                    document.getElementById('level-play-score').innerText = 'No saved progress — begin from Level 1';
                }
            } catch (e) {
                document.getElementById('level-play-status').innerText = 'Start Fresh';
                document.getElementById('level-play-score').innerText = '';
            }

            const splash = document.getElementById('daily-splash');
            splash.style.opacity = '0';
            splash.classList.remove('hidden');
            requestAnimationFrame(() => {
                splash.style.transition = 'opacity 0.2s';
                splash.style.opacity = '1';
            });
        }

        function showSplashScreen() {
            // Freeze any in-flight paths
            State.paths.forEach(p => {
                if (p.state === 'MOVING') { p.state = 'IDLE'; p.animProgress = 0; }
            });
            State.animatingCount = 0;

            if (!State.dailyPuzzleMode) {
                Persistence.saveState(); // preserve level play progress
            }

            State.dailyPuzzleMode = false;
            State.isWinState = false;
            State.isFailState = false;

            document.getElementById('daily-result-overlay').classList.add('hidden');
            document.getElementById('win-overlay').classList.add('opacity-0', 'pointer-events-none', 'scale-105');
            document.getElementById('fail-overlay').classList.add('opacity-0', 'pointer-events-none', 'scale-105');

            initDailySplash();
        }

        function startDailyPuzzle() {
            const splash = document.getElementById('daily-splash');
            splash.style.transition = 'opacity 0.25s';
            splash.style.opacity = '0';
            setTimeout(() => splash.classList.add('hidden'), 260);

            State.dailyPuzzleMode = true;
            State.dailyPuzzleScoreAtStart = State.score;

            // Swap Math.random with date-seeded RNG for deterministic generation
            const seededRng = mulberry32(getDailyPuzzleSeed());
            const origRandom = Math.random;
            Math.random = seededRng;

            // Fixed level 7 gives a medium-hard grid (10–20 × 10–20)
            const savedLevel = State.level;
            const savedPreset = State.gridSizePreset;
            State.level = 7;
            State.gridSizePreset = "Auto";

            build100PackedLevel(true);

            Math.random = origRandom;
            State.level = savedLevel;
            State.gridSizePreset = savedPreset;
        }

        function startNormalGame() {
            const splash = document.getElementById('daily-splash');
            splash.style.transition = 'opacity 0.25s';
            splash.style.opacity = '0';
            setTimeout(() => splash.classList.add('hidden'), 260);

            build100PackedLevel(false);
        }

        function exitDailyPuzzle() {
            // Capture earnings before persistence reload wipes State.score
            const scoreEarned = State.score - State.dailyPuzzleScoreAtStart;

            State.dailyPuzzleMode = false;
            State.isWinState = false;
            State.isFailState = false;
            State.hintPathId = null;
            State.selectedPath = null;
            State.particles = [];
            State.animatingCount = 0;
            document.getElementById('daily-result-overlay').classList.add('hidden');
            document.getElementById('win-overlay').classList.add('opacity-0', 'pointer-events-none', 'scale-105');

            build100PackedLevel(false); // restores saved score (pre-daily)

            // Add earned points back on top of the restored normal game score
            if (scoreEarned > 0) {
                State.score += scoreEarned;
                Persistence.saveState();
                updateDomUI();
            }
        }

        // ─────────────────────────────────────────────────────────────────────────

        window.onload = () => {
            resizeCanvas();
            animationUpdateTick();
            initDailySplash();
        };
    </script>
</body>

</html>
