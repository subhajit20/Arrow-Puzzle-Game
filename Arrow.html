<!DOCTYPE html>
<html lang="en" style="height: -webkit-fill-available;">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>VECTO: Colossal Mosaic Edition</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            touch-action: none;
            /* SVH = small viewport height — excludes iOS Safari address bar */
            height: 100svh !important;
            min-height: -webkit-fill-available;
            /* Respect notch / home-indicator on iPhone X+ */
            padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
            padding-left: max(0.75rem, env(safe-area-inset-left));
            padding-right: max(0.75rem, env(safe-area-inset-right));
        }

        /* ── Mobile: board fills entire screen, bars float on top ── */
        @media (max-width: 767px) {
            body {
                padding: 0 !important;
                display: block !important;
            }

            #board-container {
                position: fixed !important;
                inset: 0 !important;
                width: 100vw !important;
                height: 100svh !important;
                max-width: none !important;
                margin: 0 !important;
                border-radius: 0 !important;
                border-width: 0 !important;
                box-shadow: none !important;
                aspect-ratio: auto !important;
                z-index: 0 !important;
            }

            #game-header {
                position: fixed !important;
                top: 0 !important;
                left: 0 !important;
                right: 0 !important;
                z-index: 20 !important;
                max-width: none !important;
                border-radius: 0 !important;
                border-left: none !important;
                border-right: none !important;
                border-top: none !important;
                background: rgba(255, 255, 255, 0.82) !important;
                backdrop-filter: blur(14px) !important;
                -webkit-backdrop-filter: blur(14px) !important;
                box-shadow: 0 1px 0 rgba(0, 0, 0, 0.06) !important;
                padding-top: max(0.75rem, env(safe-area-inset-top)) !important;
                padding-left: max(0.75rem, env(safe-area-inset-left)) !important;
                padding-right: max(0.75rem, env(safe-area-inset-right)) !important;
            }

            #game-controls {
                position: fixed !important;
                bottom: 0 !important;
                left: 0 !important;
                right: 0 !important;
                z-index: 20 !important;
                max-width: none !important;
                border-radius: 0 !important;
                border-left: none !important;
                border-right: none !important;
                border-bottom: none !important;
                background: rgba(255, 255, 255, 0.82) !important;
                backdrop-filter: blur(14px) !important;
                -webkit-backdrop-filter: blur(14px) !important;
                box-shadow: 0 -1px 0 rgba(0, 0, 0, 0.06) !important;
                padding-bottom: max(0.75rem, env(safe-area-inset-bottom)) !important;
                padding-left: max(0.75rem, env(safe-area-inset-left)) !important;
                padding-right: max(0.75rem, env(safe-area-inset-right)) !important;
            }
        }

        /* ── Desktop: square board constrained by both viewport width and height ── */
        @media (min-width: 768px) {
            #board-container {
                width: min(calc(100vw - 48px), calc(100svh - 185px), 28rem) !important;
            }
        }

        /* ── Landscape phones: compact bars ── */
        @media (max-width: 767px) and (orientation: landscape) {
            #game-header {
                padding-top: max(0.4rem, env(safe-area-inset-top)) !important;
                padding-bottom: 0.4rem !important;
            }

            #game-controls {
                padding-top: 0.4rem !important;
                padding-bottom: max(0.4rem, env(safe-area-inset-bottom)) !important;
            }

            #level-display {
                font-size: 1rem !important;
                line-height: 1.2 !important;
            }

            #score-display {
                font-size: 1rem !important;
            }

            #tier-badge {
                display: none !important;
            }

            .hint-label {
                display: none;
            }
        }

        /* Splash: scrollable on very short or zoomed-in screens */
        #daily-splash {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* Canvas GPU layer — CSS transform zoom is composited on GPU, no redraw needed */
        #gameCanvas {
            will-change: transform;
            transform-origin: 0 0;
        }

        .premium-shadow {
            box-shadow: 0 12px 30px -10px rgba(15, 23, 42, 0.08), 0 4px 12px -5px rgba(15, 23, 42, 0.03);
        }

        .board-shadow {
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.01), 0 20px 45px -15px rgba(15, 23, 42, 0.12);
        }

        .shake {
            animation: shake 0.4s cubic-bezier(.36, .07, .19, .97) both;
        }

        @keyframes shake {

            10%,
            90% {
                transform: translate3d(-2px, 0, 0);
            }

            20%,
            80% {
                transform: translate3d(4px, 0, 0);
            }

            30%,
            50%,
            70% {
                transform: translate3d(-5px, 0, 0);
            }

            40%,
            60% {
                transform: translate3d(5px, 0, 0);
            }
        }

        .glow-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>

    <!-- Web Audio Synthesis Module -->
    <script>
        const AudioEngine = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            playTone(freq, type, duration, vol) {
                this.init();
                if (!this.ctx) return;
                try {
                    let osc = this.ctx.createOscillator();
                    let gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) { }
            },
            tap() { this.playTone(600.00, 'triangle', 0.1, 0.1); },
            clear() {
                this.playTone(523.25, 'sine', 0.12, 0.08);
                setTimeout(() => this.playTone(659.25, 'sine', 0.12, 0.08), 60);
                setTimeout(() => this.playTone(783.99, 'sine', 0.2, 0.1), 120);
            },
            crash() {
                this.playTone(180, 'sawtooth', 0.2, 0.15);
                this.playTone(90, 'triangle', 0.25, 0.2);
            },
            win() {
                let now = 0;
                [523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 987.77, 1046.50].forEach((f, i) => {
                    setTimeout(() => this.playTone(f, 'sine', 0.15, 0.08), now);
                    now += 50;
                });
            }
        };
    </script>

    <!-- Core Game Controller Script -->
    <script>
        const State = {
            gridSizePreset: "Auto", // "Auto", "Standard", "Grand", "Colossal", "Titan", "Cosmic"
            level: 1,
            score: 0,
            lives: 3,
            gridRows: 8,
            gridCols: 8,
            gridSize: 8, // Kept for backward compatibility as Math.max(gridRows, gridCols)
            gridMask: [], // 1 = playable, 0 = masked/void, -1 = solid obstacle pillar
            shapeName: "Square Matrix",
            paths: [],
            particles: [],
            selectedPath: null,
            isWinState: false,
            isFailState: false,
            animatingCount: 0,
            cellSize: 0,
            offsetX: 0,
            offsetY: 0,
            hintPathId: null,
            levelStartScore: 0,
            dailyPuzzleMode: false,
            dailyPuzzleScoreAtStart: 0,
            // CSS-transform camera (scale + translation matrix components)
            cssZoom: 1.0,
            matE: 0,   // x translation in board-container pixels
            matF: 0    // y translation in board-container pixels
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Cyclic grid size preset mappings supporting up to extreme 50x50 grids
        const SIZING_PRESETS = ["Auto", "Standard", "Grand", "Colossal", "Titan", "Cosmic"];

        function generateRandomGridDimensions(preset, level) {
            let minR, maxR, minC, maxC;

            if (preset === "Standard") {
                minR = 2; maxR = 12;
                minC = 2; maxC = 12;
            } else if (preset === "Grand") {
                minR = 12; maxR = 22;
                minC = 12; maxC = 22;
            } else if (preset === "Colossal") {
                minR = 20; maxR = 32;
                minC = 20; maxC = 32;
            } else if (preset === "Titan") {
                minR = 30; maxR = 42;
                minC = 30; maxC = 42;
            } else if (preset === "Cosmic") {
                minR = 40; maxR = 50;
                minC = 40; maxC = 50;
            } else { // "Auto" mode scaling beautifully up to 50
                if (level <= 2) {
                    minR = 2; maxR = 8;
                    minC = 2; maxC = 8;
                } else if (level <= 5) {
                    minR = 6; maxR = 12;
                    minC = 6; maxC = 12;
                } else if (level <= 8) {
                    minR = 10; maxR = 20;
                    minC = 10; maxC = 20;
                } else if (level <= 12) {
                    minR = 18; maxR = 30;
                    minC = 18; maxC = 30;
                } else if (level <= 18) {
                    minR = 25; maxR = 40;
                    minC = 25; maxC = 40;
                } else {
                    minR = 35; maxR = 50;
                    minC = 35; maxC = 50;
                }
            }

            // Generate totally random independent rows and cols within the bounds
            let rows = minR + Math.floor(Math.random() * (maxR - minR + 1));
            let cols = minC + Math.floor(Math.random() * (maxC - minC + 1));

            // Ensure dimensions are strictly within [2, 50]
            rows = Math.min(50, Math.max(2, rows));
            cols = Math.min(50, Math.max(2, cols));

            return { rows, cols };
        }

        function getDifficultyLabel(level) {
            const maxDim = Math.max(State.gridRows, State.gridCols);
            if (State.gridSizePreset !== "Auto") {
                return { label: `${State.gridSizePreset.toUpperCase()}`, color: "#6366f1" };
            }
            if (maxDim <= 8) return { label: "NORMAL", color: "#10b981" };
            if (maxDim <= 12) return { label: "HARD", color: "#3b82f6" };
            if (maxDim <= 20) return { label: "EXPERT", color: "#f97316" };
            if (maxDim <= 30) return { label: "GRAND", color: "#a855f7" };
            return { label: "TITAN", color: "#ec4899" };
        }

        // Dynamic Board Mask Topologies (supporting rectangular aspect ratios)
        const TOPOLOGIES = {
            SQUARE: {
                name: "Square Matrix",
                makeMask: (r, c) => Array(r).fill().map(() => Array(c).fill(1))
            },
            CROSS: {
                name: "Cruciform Cross",
                makeMask: (r, c) => {
                    let m = Array(r).fill().map(() => Array(c).fill(0));
                    let padR = Math.floor(r * 0.25);
                    let padC = Math.floor(c * 0.25);
                    for (let row = 0; row < r; row++) {
                        for (let col = 0; col < c; col++) {
                            if ((row >= padR && row < r - padR) || (col >= padC && col < c - padC)) m[row][col] = 1;
                        }
                    }
                    return m;
                }
            },
            DIAMOND: {
                name: "Rhombus Diamond",
                makeMask: (r, c) => {
                    let m = Array(r).fill().map(() => Array(c).fill(0));
                    let midR = (r - 1) / 2;
                    let midC = (c - 1) / 2;
                    for (let row = 0; row < r; row++) {
                        for (let col = 0; col < c; col++) {
                            if (Math.abs(row - midR) / Math.max(1, midR) + Math.abs(col - midC) / Math.max(1, midC) <= 1.0) m[row][col] = 1;
                        }
                    }
                    return m;
                }
            },
            DONUT: {
                name: "Hollow Donut",
                makeMask: (r, c) => {
                    let m = Array(r).fill().map(() => Array(c).fill(1));
                    let padR = Math.max(1, Math.floor(r * 0.3));
                    let padC = Math.max(1, Math.floor(c * 0.3));
                    for (let row = padR; row < r - padR; row++) {
                        for (let col = padC; col < c - padC; col++) m[row][col] = 0;
                    }
                    return m;
                }
            },
            OCTAGON: {
                name: "Beveled Octagon",
                makeMask: (r, c) => {
                    let m = Array(r).fill().map(() => Array(c).fill(1));
                    for (let row = 0; row < r; row++) {
                        for (let col = 0; col < c; col++) {
                            if (row / r + col / c < 0.25) m[row][col] = 0;
                            if ((r - 1 - row) / r + col / c < 0.25) m[row][col] = 0;
                            if (row / r + (c - 1 - col) / c < 0.25) m[row][col] = 0;
                            if ((r - 1 - row) / r + (c - 1 - col) / c < 0.25) m[row][col] = 0;
                        }
                    }
                    return m;
                }
            },
            CIRCLE: {
                name: "Circle Shield",
                makeMask: (r, c) => {
                    let m = Array(r).fill().map(() => Array(c).fill(0));
                    let midR = (r - 1) / 2;
                    let midC = (c - 1) / 2;
                    for (let row = 0; row < r; row++) {
                        for (let col = 0; col < c; col++) {
                            let dist = Math.pow((row - midR) / Math.max(1, midR), 2) + Math.pow((col - midC) / Math.max(1, midC), 2);
                            if (dist <= 1.25) m[row][col] = 1;
                        }
                    }
                    return m;
                }
            },
            HOURGLASS: {
                name: "Hourglass Prism",
                makeMask: (r, c) => {
                    let m = Array(r).fill().map(() => Array(c).fill(1));
                    for (let row = 0; row < r; row++) {
                        let factor = Math.abs(row - (r - 1) / 2) / Math.max(1, r / 2);
                        let cut = Math.floor(c * 0.35 * (1 - factor));
                        for (let col = 0; col < cut; col++) {
                            m[row][col] = 0;
                            m[row][c - 1 - col] = 0;
                        }
                    }
                    return m;
                }
            },
            WAVES: {
                name: "Serpentine Waves",
                makeMask: (r, c) => {
                    let m = Array(r).fill().map(() => Array(c).fill(1));
                    for (let row = 0; row < r; row++) {
                        for (let col = 0; col < c; col++) {
                            let wave = Math.sin(row * 0.8) * (c * 0.15);
                            let center = c / 2 + wave;
                            if (Math.abs(col - center) > c * 0.38) {
                                m[row][col] = 0;
                            }
                        }
                    }
                    return m;
                }
            },
            CORNER_CASTLE: {
                name: "Corner Castle",
                makeMask: (r, c) => {
                    let m = Array(r).fill().map(() => Array(c).fill(1));
                    let blockR = Math.max(1, Math.floor(r * 0.35));
                    let blockC = Math.max(1, Math.floor(c * 0.35));
                    for (let row = 0; row < blockR; row++) {
                        for (let col = 0; col < blockC; col++) {
                            m[row][col] = 0;
                        }
                    }
                    for (let row = r - blockR; row < r; row++) {
                        for (let col = c - blockC; col < c; col++) {
                            m[row][col] = 0;
                        }
                    }
                    return m;
                }
            },
            GATEWAY: {
                name: "Hedge Gateway",
                makeMask: (r, c) => {
                    let m = Array(r).fill().map(() => Array(c).fill(1));
                    let wallW = Math.max(1, Math.floor(c * 0.25));
                    let midR = Math.floor(r / 2);
                    for (let col = 0; col < wallW; col++) {
                        m[midR][col] = 0;
                        m[midR][c - 1 - col] = 0;
                    }
                    return m;
                }
            }
        };

        // Pick dynamic board topology based on grid size and level
        function getTopologyForLevel(level, rows, cols) {
            const choices = Object.values(TOPOLOGIES);
            return choices[Math.floor(Math.random() * choices.length)];
        }

        const Persistence = {
            saveState() {
                if (State.dailyPuzzleMode) return; // daily puzzle never overwrites normal game save
                try {
                    const dataToSave = {
                        level: State.level,
                        score: State.score,
                        lives: State.lives,
                        gridRows: State.gridRows,
                        gridCols: State.gridCols,
                        gridSize: State.gridSize,
                        gridMask: State.gridMask,
                        shapeName: State.shapeName,
                        gridSizePreset: State.gridSizePreset,
                        paths: State.paths
                    };
                    localStorage.setItem('vecto_colossal_mosaic_save_v2', JSON.stringify(dataToSave));
                } catch (e) {
                    console.error("Failed to write to local storage quota:", e);
                }
            },
            loadState() {
                const rawData = localStorage.getItem('vecto_colossal_mosaic_save_v2');
                if (!rawData) return false;
                try {
                    const saved = JSON.parse(rawData);
                    let mask = saved.gridMask || [];
                    // Discard stale legacy states containing obstacle pillars (-1) or single-dimension bounds
                    if (mask.some(row => row.includes(-1)) || !saved.gridRows || !saved.gridCols) {
                        return false;
                    }
                    State.level = saved.level || 1;
                    State.score = saved.score || 0;
                    State.lives = saved.lives !== undefined ? saved.lives : 3;
                    State.gridRows = saved.gridRows;
                    State.gridCols = saved.gridCols;
                    State.gridSize = saved.gridSize || Math.max(saved.gridRows, saved.gridCols);
                    State.gridMask = mask;
                    State.shapeName = saved.shapeName || "Square Matrix";
                    State.gridSizePreset = saved.gridSizePreset || "Auto";
                    State.paths = saved.paths || [];
                    return true;
                } catch (e) {
                    console.error("Failed to rehydrate data store:", e);
                    return false;
                }
            },
            clearState() {
                localStorage.removeItem('vecto_colossal_mosaic_save_v2');
            }
        };

        function applyBoardTransform() {
            if (State.cssZoom <= 1.0) {
                State.cssZoom = 1.0;
                State.matE = 0;
                State.matF = 0;
            }
            canvas.style.transform = `matrix(${State.cssZoom},0,0,${State.cssZoom},${State.matE},${State.matF})`;
        }

        function resetCamera() {
            State.cssZoom = 1.0;
            State.matE = 0;
            State.matF = 0;
            applyBoardTransform();
        }

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const bcr = canvas.getBoundingClientRect();
            canvas.width = bcr.width * dpr;
            canvas.height = bcr.height * dpr;
            ctx.scale(dpr, dpr);
            calculateMetrics(bcr.width, bcr.height);
        }

        function calculateMetrics(w, h) {
            State.cellSize = Math.min(w / State.gridCols, h / State.gridRows);
            State.offsetX = (w - (State.gridCols * State.cellSize)) / 2;
            State.offsetY = (h - (State.gridRows * State.cellSize)) / 2;
        }

        function getTrackPoint(trackList, d) {
            if (d <= 0) return trackList[0];
            if (d >= trackList.length - 1) return trackList[trackList.length - 1];
            let idx = Math.floor(d);
            let frac = d - idx;
            let p1 = trackList[idx];
            let p2 = trackList[idx + 1];
            return {
                x: p1.x + (p2.x - p1.x) * frac,
                y: p1.y + (p2.y - p1.y) * frac
            };
        }

        function getSubTrackPoints(trackList, dStart, dEnd) {
            let pts = [];
            if (dStart < 0) dStart = 0;
            if (dEnd > trackList.length - 1) dEnd = trackList.length - 1;
            if (dStart >= dEnd) return pts;

            pts.push(getTrackPoint(trackList, dStart));

            let firstInt = Math.ceil(dStart);
            let lastInt = Math.floor(dEnd);
            for (let i = firstInt; i <= lastInt; i++) {
                pts.push(trackList[i]);
            }

            pts.push(getTrackPoint(trackList, dEnd));
            return pts;
        }

        function getStraightLineReach(r, c, dr, dc, gridOwnership) {
            let reach = 0;
            let cr = r + dr;
            let cc = c + dc;
            while (cr >= 0 && cr < State.gridRows && cc >= 0 && cc < State.gridCols) {
                if (gridOwnership[cr][cc] !== -1) break;
                reach++;
                cr += dr;
                cc += dc;
            }
            return reach;
        }

        function getHeadingFromDiff(dr, dc) {
            if (dr === -1 && dc === 0) return "UP";
            if (dr === 1 && dc === 0) return "DOWN";
            if (dr === 0 && dc === -1) return "LEFT";
            if (dr === 0 && dc === 1) return "RIGHT";
            return "RIGHT";
        }

        // Projects a ray forward from the endpoint to check if it collides with its own body (Chevron Self-Collision Guard)
        function evaluateEndpoint(headCell, dir, bodyPoints, rows, cols) {
            let dr = dir.r;
            let dc = dir.c;
            let cr = headCell.r + dr;
            let cc = headCell.c + dc;
            let selfIntersect = false;
            let selfIntersectDist = Infinity; // steps until first body hit (Infinity = never hits)
            let boardBlocks = 0;
            let adjacentBodyCount = 0;
            // Perpendicular axes to heading — body cells flanking the escape ray look confusing
            let perpR = dc;
            let perpC = dr;

            while (cr >= 0 && cr < rows && cc >= 0 && cc < cols) {
                boardBlocks++;
                if (bodyPoints.some(pt => pt.r === cr && pt.c === cc)) {
                    if (!selfIntersect) selfIntersectDist = boardBlocks; // record distance of first hit
                    selfIntersect = true;
                }
                if (bodyPoints.some(pt => pt.r === cr + perpR && pt.c === cc + perpC)) adjacentBodyCount++;
                if (bodyPoints.some(pt => pt.r === cr - perpR && pt.c === cc - perpC)) adjacentBodyCount++;
                cr += dr;
                cc += dc;
            }

            return { selfIntersect, selfIntersectDist, boardBlocks, adjacentBodyCount };
        }

        // Applies the No-Self-Collision Arrowhead Selection Rules
        function assignSmartHeadings(paths, rows, cols) {
            paths.forEach(p => {
                let len = p.points.length;
                if (len < 2) return;

                // Option A: Endpoint at index 0 is the Head
                let ptA = p.points[0];
                let ptA_next = p.points[1];
                let dirA = { r: ptA.r - ptA_next.r, c: ptA.c - ptA_next.c };
                let bodyA = p.points.slice(1);

                // Option B: Endpoint at index len-1 is the Head
                let ptB = p.points[len - 1];
                let ptB_prev = p.points[len - 2];
                let dirB = { r: ptB.r - ptB_prev.r, c: ptB.c - ptB_prev.c };
                let bodyB = p.points.slice(0, len - 1);

                let evalA = evaluateEndpoint(ptA, dirA, bodyA, rows, cols);
                let evalB = evaluateEndpoint(ptB, dirB, bodyB, rows, cols);

                // Straight run-in: last 2 body segments before the head are collinear with heading.
                // Prefer this — the arrowhead reads clearly when it continues a straight line.
                let straightA = len >= 3 &&
                    (p.points[0].r - p.points[1].r) === (p.points[1].r - p.points[2].r) &&
                    (p.points[0].c - p.points[1].c) === (p.points[1].c - p.points[2].c);
                let straightB = len >= 3 &&
                    (p.points[len - 1].r - p.points[len - 2].r) === (p.points[len - 2].r - p.points[len - 3].r) &&
                    (p.points[len - 1].c - p.points[len - 2].c) === (p.points[len - 2].c - p.points[len - 3].c);

                // Fix A: Count full consecutive straight-run-in length (not just 2-deep).
                // Longer straight approach = clearer reading of arrow direction.
                let runInA = 1;
                for (let i = 2; i < len; i++) {
                    if (p.points[i - 1].r - p.points[i].r === dirA.r &&
                        p.points[i - 1].c - p.points[i].c === dirA.c) runInA++;
                    else break;
                }
                let runInB = 1;
                for (let i = len - 3; i >= 0; i--) {
                    if (p.points[i + 1].r - p.points[i].r === dirB.r &&
                        p.points[i + 1].c - p.points[i].c === dirB.c) runInB++;
                    else break;
                }

                // Fix B: Detect near-closed-loop confusion — heading that points toward the
                // opposite endpoint makes the path look like it's about to close a ring.
                // dot > 0 means the escape direction points toward the other endpoint (bad).
                let aHeadsTowardTail = (dirA.r * (ptB.r - ptA.r) + dirA.c * (ptB.c - ptA.c)) > 0;
                let bHeadsTowardTail = (dirB.r * (ptA.r - ptB.r) + dirB.c * (ptA.c - ptB.c)) > 0;

                let chooseA = false;
                if (evalA.selfIntersect && !evalB.selfIntersect) {
                    chooseA = false; // B is safe, choose B
                } else if (!evalA.selfIntersect && evalB.selfIntersect) {
                    chooseA = true;  // A is safe, choose A
                } else if (evalA.selfIntersect && evalB.selfIntersect) {
                    // Both trapped — the gap-fill boxed in both ends.
                    // Primary: prefer the endpoint whose body collision is farther away
                    // (arrow travels more cells before appearing to crash into its own path).
                    if (evalA.selfIntersectDist !== evalB.selfIntersectDist) {
                        chooseA = evalA.selfIntersectDist > evalB.selfIntersectDist;
                    } else if (!aHeadsTowardTail && bHeadsTowardTail) {
                        chooseA = true;
                    } else if (aHeadsTowardTail && !bHeadsTowardTail) {
                        chooseA = false;
                    } else if (straightA !== straightB) {
                        chooseA = straightA;
                    } else if (runInA !== runInB) {
                        chooseA = runInA > runInB;
                    } else {
                        chooseA = evalA.adjacentBodyCount < evalB.adjacentBodyCount;
                    }
                } else {
                    // Both safe — break ties by visual clarity.
                    // 0. Prefer heading that points AWAY from the opposite endpoint (Fix B).
                    // 1. Prefer straight run-in (no corner at the head).
                    // 2. Prefer longer consecutive straight run-in (Fix A).
                    // 3. Fewer body cells flanking the escape ray.
                    // 4. Fewer board cells blocking the escape vector.
                    if (!aHeadsTowardTail && bHeadsTowardTail) {
                        chooseA = true;
                    } else if (aHeadsTowardTail && !bHeadsTowardTail) {
                        chooseA = false;
                    } else if (straightA !== straightB) {
                        chooseA = straightA;
                    } else if (runInA !== runInB) {
                        chooseA = runInA > runInB;
                    } else if (evalA.adjacentBodyCount !== evalB.adjacentBodyCount) {
                        chooseA = evalA.adjacentBodyCount < evalB.adjacentBodyCount;
                    } else {
                        chooseA = evalA.boardBlocks < evalB.boardBlocks;
                    }
                }

                if (chooseA) {
                    p.points.reverse();
                    let newLast = p.points[len - 1];
                    let newPrev = p.points[len - 2];
                    p.heading = getHeadingFromDiff(newLast.r - newPrev.r, newLast.c - newPrev.c);
                } else {
                    p.heading = getHeadingFromDiff(ptB.r - ptB_prev.r, ptB.c - ptB_prev.c);
                }
                p.originalPoints = JSON.parse(JSON.stringify(p.points));
            });
        }

        function getOccupiedNeighborsCount(r, c, gridOwnership) {
            let count = 0;
            const dMoves = [[-1, 0], [1, 0], [0, -1], [0, 1]];
            for (let d of dMoves) {
                let nr = r + d[0];
                let nc = c + d[1];
                if (nr < 0 || nr >= State.gridRows || nc < 0 || nc >= State.gridCols) {
                    count += 2; // Treat board limits as boundaries to hug walls!
                } else if (gridOwnership[nr][nc] !== -1) {
                    count += 1;
                }
            }
            return count;
        }

        // Generates raw layout structure candidates with stair (zigzag), spirals, and straight behaviors
        function tryGenerateBoard() {
            let gridOwnership = Array(State.gridRows).fill().map(() => Array(State.gridCols).fill(-1));

            // Mask out cells based on custom mask topology
            for (let r = 0; r < State.gridRows; r++) {
                for (let c = 0; c < State.gridCols; c++) {
                    if (State.gridMask[r][c] === 0 || State.gridMask[r][c] === -1) {
                        gridOwnership[r][c] = -2; // Masked out / obstacle block
                    }
                }
            }

            let paths = [];
            let pathIdCounter = 1;
            const dMoves = [[-1, 0], [1, 0], [0, -1], [0, 1]];

            while (true) {
                let bestCell = null;
                let maxScore = -1;

                // Blazingly fast single-pass O(N) scan to find the most tucked-in starting cell
                for (let r = 0; r < State.gridRows; r++) {
                    for (let c = 0; c < State.gridCols; c++) {
                        if (gridOwnership[r][c] === -1) {
                            let score = getOccupiedNeighborsCount(r, c, gridOwnership) + Math.random() * 0.5;
                            if (score > maxScore) {
                                maxScore = score;
                                bestCell = { r, c };
                            }
                        }
                    }
                }

                if (!bestCell) break;

                let cell = bestCell;
                let currentPath = [{ r: cell.r, c: cell.c }];
                gridOwnership[cell.r][cell.c] = pathIdCounter;

                let cr = cell.r;
                let cc = cell.c;

                // Select crawler style: Spiral, Serpentine, Stair, or Winding L
                const styleRoll = Math.random();
                let isSpiral = styleRoll < 0.35; // 35% spiral bias (creates gorgeous nested square curls)
                let isSerpentine = !isSpiral && styleRoll < 0.65; // 30% serpentine winding S-bends
                let isStairWinder = !isSpiral && !isSerpentine && styleRoll < 0.85; // 20% steps

                let bestDir = dMoves[Math.floor(Math.random() * dMoves.length)];
                let maxReach = -1;
                for (let m of dMoves) {
                    let reach = getStraightLineReach(cr, cc, m[0], m[1], gridOwnership);
                    if (reach > maxReach) {
                        maxReach = reach;
                        bestDir = m;
                    }
                }

                let lastMove = bestDir;
                // Target length limits designed for optimum pack density and beautiful flow
                let maxDim = Math.max(State.gridRows, State.gridCols);
                let maxLen = 7;
                if (maxDim >= 60) maxLen = 8 + Math.floor(Math.random() * 5); // 8 to 12
                else if (maxDim >= 40) maxLen = 9 + Math.floor(Math.random() * 6); // 9 to 14
                else if (maxDim >= 20) maxLen = 10 + Math.floor(Math.random() * 7); // 10 to 16
                else maxLen = 12 + Math.floor(Math.random() * 7); // 12 to 18

                let consecutiveStraight = 0;
                let spiralDir = Math.random() < 0.5 ? 1 : -1; // spiral orientation direction

                for (let step = 0; step < maxLen; step++) {
                    let nextR = cr + lastMove[0];
                    let nextC = cc + lastMove[1];
                    let canGoStraight = (nextR >= 0 && nextR < State.gridRows && nextC >= 0 && nextC < State.gridCols && gridOwnership[nextR][nextC] === -1);

                    let chosenMove = null;

                    if (isSpiral) {
                        // SPIRAL: Prefer turning consistently CW or CCW to wrap inwards
                        let orderedMoves = [];
                        if (lastMove[0] === 0) {
                            orderedMoves = [[lastMove[1] * spiralDir, 0], [0, lastMove[1]]];
                        } else {
                            orderedMoves = [[0, -lastMove[0] * spiralDir], [lastMove[0], 0]];
                        }

                        if (canGoStraight && consecutiveStraight < 2) {
                            chosenMove = lastMove;
                            consecutiveStraight++;
                        } else {
                            let turnMove = orderedMoves[0];
                            let tr = cr + turnMove[0];
                            let tc = cc + turnMove[1];
                            if (tr >= 0 && tr < State.gridRows && tc >= 0 && tc < State.gridCols && gridOwnership[tr][tc] === -1) {
                                chosenMove = turnMove;
                                consecutiveStraight = 0;
                            } else if (canGoStraight) {
                                chosenMove = lastMove;
                                consecutiveStraight++;
                            } else {
                                break;
                            }
                        }
                    } else if (isSerpentine) {
                        // SERPENTINE: Alternates turns perpendicularly to make clean hooks
                        if (canGoStraight && consecutiveStraight < 3) {
                            chosenMove = lastMove;
                            consecutiveStraight++;
                        } else {
                            let turnOptions = [];
                            for (let m of dMoves) {
                                if (m[0] === -lastMove[0] && m[1] === -lastMove[1]) continue;
                                if (m[0] === lastMove[0] && m[1] === lastMove[1]) continue;

                                let tr = cr + m[0];
                                let tc = cc + m[1];
                                if (tr >= 0 && tr < State.gridRows && tc >= 0 && tc < State.gridCols && gridOwnership[tr][tc] === -1) {
                                    turnOptions.push(m);
                                }
                            }

                            if (turnOptions.length > 0) {
                                turnOptions.sort((a, b) => {
                                    let nA = getOccupiedNeighborsCount(cr + a[0], cc + a[1], gridOwnership);
                                    let nB = getOccupiedNeighborsCount(cr + b[0], cc + b[1], gridOwnership);
                                    let rA = getStraightLineReach(cr, cc, a[0], a[1], gridOwnership);
                                    let rB = getStraightLineReach(cr, cc, b[0], b[1], gridOwnership);
                                    return (nB * 3 + rB) - (nA * 3 + rA);
                                });
                                chosenMove = turnOptions[0];
                                consecutiveStraight = 0;
                            } else if (canGoStraight) {
                                chosenMove = lastMove;
                                consecutiveStraight++;
                            } else {
                                break;
                            }
                        }
                    } else if (isStairWinder) {
                        // STAIRCASE: Alternating rapid steps
                        let turnOptions = [];
                        for (let m of dMoves) {
                            if (m[0] === -lastMove[0] && m[1] === -lastMove[1]) continue;
                            if (m[0] === lastMove[0] && m[1] === lastMove[1]) continue;

                            let tr = cr + m[0];
                            let tc = cc + m[1];
                            if (tr >= 0 && tr < State.gridRows && tc >= 0 && tc < State.gridCols && gridOwnership[tr][tc] === -1) {
                                turnOptions.push(m);
                            }
                        }

                        if (consecutiveStraight === 0 && turnOptions.length > 0) {
                            chosenMove = turnOptions[Math.floor(Math.random() * turnOptions.length)];
                            consecutiveStraight = 1;
                        } else if (canGoStraight) {
                            chosenMove = lastMove;
                            consecutiveStraight = 0;
                        } else if (turnOptions.length > 0) {
                            chosenMove = turnOptions[Math.floor(Math.random() * turnOptions.length)];
                            consecutiveStraight = 1;
                        } else {
                            break;
                        }
                    } else {
                        // STANDARD TIGHT HUG CORRIDORS
                        if (canGoStraight && (consecutiveStraight < 3 || Math.random() < 0.95)) {
                            chosenMove = lastMove;
                            consecutiveStraight++;
                        } else {
                            let turnOptions = [];
                            for (let m of dMoves) {
                                if (m[0] === -lastMove[0] && m[1] === -lastMove[1]) continue;
                                if (m[0] === lastMove[0] && m[1] === lastMove[1]) continue;

                                let tr = cr + m[0];
                                let tc = cc + m[1];
                                if (tr >= 0 && tr < State.gridRows && tc >= 0 && tc < State.gridCols && gridOwnership[tr][tc] === -1) {
                                    let straightReach = getStraightLineReach(cr, cc, m[0], m[1], gridOwnership);
                                    let neighbors = getOccupiedNeighborsCount(tr, tc, gridOwnership);
                                    turnOptions.push({ move: m, score: neighbors * 3 + straightReach });
                                }
                            }
                            if (turnOptions.length > 0) {
                                turnOptions.sort((a, b) => b.score - a.score);
                                chosenMove = turnOptions[0].move;
                                consecutiveStraight = 1;
                            } else if (canGoStraight) {
                                chosenMove = lastMove;
                                consecutiveStraight++;
                            } else {
                                break;
                            }
                        }
                    }

                    cr += chosenMove[0];
                    cc += chosenMove[1];
                    currentPath.push({ r: cr, c: cc });
                    gridOwnership[cr][cc] = pathIdCounter;
                    lastMove = chosenMove;
                }

                if (currentPath.length >= 2) {
                    // Check if both endpoints are self-intersecting (Chevron Self-Collision Guard)
                    let len = currentPath.length;
                    let ptA = currentPath[0];
                    let ptA_next = currentPath[1];
                    let dirA = { r: ptA.r - ptA_next.r, c: ptA.c - ptA_next.c };
                    let bodyA = currentPath.slice(1);

                    let ptB = currentPath[len - 1];
                    let ptB_prev = currentPath[len - 2];
                    let dirB = { r: ptB.r - ptB_prev.r, c: ptB.c - ptB_prev.c };
                    let bodyB = currentPath.slice(0, len - 1);

                    let evalA = evaluateEndpoint(ptA, dirA, bodyA, State.gridRows, State.gridCols);
                    let evalB = evaluateEndpoint(ptB, dirB, bodyB, State.gridRows, State.gridCols);

                    if (evalA.selfIntersect && evalB.selfIntersect) {
                        // Discard this self-colliding path to prevent visual self-collision confusion!
                        currentPath.forEach(pt => {
                            gridOwnership[pt.r][pt.c] = -3; // Mark as failed start to try other areas
                        });
                    } else {
                        paths.push({
                            id: pathIdCounter,
                            points: currentPath,
                            heading: "RIGHT",
                            state: "IDLE",
                            animProgress: 0,
                            crashFlashFrames: 0,
                            originalPoints: []
                        });
                        pathIdCounter++;
                    }
                } else {
                    gridOwnership[cell.r][cell.c] = -3;
                }
            }

            // Reset temporary failed starts (-3) back to unassigned (-1) for gap filling
            for (let r = 0; r < State.gridRows; r++) {
                for (let c = 0; c < State.gridCols; c++) {
                    if (gridOwnership[r][c] === -3) {
                        gridOwnership[r][c] = -1;
                    }
                }
            }

            // Fill leftover holes cleanly (100% GAPLESS SWEEP)
            let unassigned = [];
            for (let r = 0; r < State.gridRows; r++) {
                for (let c = 0; c < State.gridCols; c++) {
                    if (gridOwnership[r][c] === -1) {
                        unassigned.push({ r, c });
                    }
                }
            }

            // Fill leftover holes — prefer attaching to endpoints whose new escape ray stays clear
            // of the path body (avoids creating both-endpoints-self-intersecting trapped paths).
            let progress = true;
            while (progress && unassigned.length > 0) {
                progress = false;
                for (let i = unassigned.length - 1; i >= 0; i--) {
                    let { r, c } = unassigned[i];
                    let cleanOption = null;  // endpoint attachment that stays self-intersection-free
                    let dirtyOption = null;  // fallback if every option is self-intersecting
                    let seenPaths = new Set();

                    for (let d of dMoves) {
                        let nr = r + d[0];
                        let nc = c + d[1];
                        if (nr >= 0 && nr < State.gridRows && nc >= 0 && nc < State.gridCols) {
                            let neighborId = gridOwnership[nr][nc];
                            if (neighborId >= 1 && !seenPaths.has(neighborId)) {
                                seenPaths.add(neighborId);
                                let path = paths[neighborId - 1];
                                if (path) {
                                    let head = path.points[path.points.length - 1];
                                    let tail = path.points[0];

                                    if (Math.abs(head.r - r) + Math.abs(head.c - c) === 1) {
                                        let newDir = { r: r - head.r, c: c - head.c };
                                        let ev = evaluateEndpoint({ r, c }, newDir, path.points, State.gridRows, State.gridCols);
                                        if (!ev.selfIntersect && !cleanOption) cleanOption = { type: 'head', path, neighborId };
                                        else if (ev.selfIntersect && !dirtyOption) dirtyOption = { type: 'head', path, neighborId };
                                    } else if (Math.abs(tail.r - r) + Math.abs(tail.c - c) === 1) {
                                        let newDir = { r: r - tail.r, c: c - tail.c };
                                        let ev = evaluateEndpoint({ r, c }, newDir, path.points, State.gridRows, State.gridCols);
                                        if (!ev.selfIntersect && !cleanOption) cleanOption = { type: 'tail', path, neighborId };
                                        else if (ev.selfIntersect && !dirtyOption) dirtyOption = { type: 'tail', path, neighborId };
                                    }
                                }
                            }
                        }
                    }

                    let chosen = cleanOption || dirtyOption;
                    if (chosen) {
                        if (chosen.type === 'head') chosen.path.points.push({ r, c });
                        else chosen.path.points.unshift({ r, c });
                        gridOwnership[r][c] = chosen.neighborId;
                        unassigned.splice(i, 1);
                        progress = true;
                    }
                }
            }

            // Strictly orthogonal fallback: Steal from head/tail of long neighboring paths (eliminates diagonals forever)
            // Fix C: Steal 2 cells when neighbor is long enough so new paths have a readable body (3 points).
            if (unassigned.length > 0) {
                for (let i = unassigned.length - 1; i >= 0; i--) {
                    let { r, c } = unassigned[i];
                    for (let d of dMoves) {
                        let nr = r + d[0];
                        let nc = c + d[1];
                        if (nr >= 0 && nr < State.gridRows && nc >= 0 && nc < State.gridCols) {
                            let neighborId = gridOwnership[nr][nc];
                            if (neighborId >= 1) {
                                let neighborPath = paths[neighborId - 1];
                                if (neighborPath && neighborPath.points.length > 2) {
                                    let head = neighborPath.points[neighborPath.points.length - 1];
                                    let tail = neighborPath.points[0];
                                    if (head.r === nr && head.c === nc) {
                                        let newId = ++pathIdCounter;
                                        let newPoints;
                                        if (neighborPath.points.length > 3) {
                                            // Steal prev_head + head → 3-point path with a visible body segment
                                            let prevHead = neighborPath.points[neighborPath.points.length - 2];
                                            neighborPath.points.pop();
                                            neighborPath.points.pop();
                                            gridOwnership[prevHead.r][prevHead.c] = newId;
                                            newPoints = [{ r: prevHead.r, c: prevHead.c }, { r: nr, c: nc }, { r, c }];
                                        } else {
                                            neighborPath.points.pop();
                                            newPoints = [{ r: nr, c: nc }, { r, c }];
                                        }
                                        gridOwnership[nr][nc] = newId;
                                        gridOwnership[r][c] = newId;
                                        paths.push({
                                            id: newId,
                                            points: newPoints,
                                            heading: getHeadingFromDiff(r - nr, c - nc),
                                            state: "IDLE",
                                            animProgress: 0,
                                            originalPoints: []
                                        });
                                        unassigned.splice(i, 1);
                                        break;
                                    } else if (tail.r === nr && tail.c === nc) {
                                        let newId = ++pathIdCounter;
                                        let newPoints;
                                        if (neighborPath.points.length > 3) {
                                            // Steal tail + next_tail → 3-point path with a visible body segment
                                            let nextTail = neighborPath.points[1];
                                            neighborPath.points.shift();
                                            neighborPath.points.shift();
                                            gridOwnership[nextTail.r][nextTail.c] = newId;
                                            newPoints = [{ r, c }, { r: nr, c: nc }, { r: nextTail.r, c: nextTail.c }];
                                        } else {
                                            neighborPath.points.shift();
                                            newPoints = [{ r, c }, { r: nr, c: nc }];
                                        }
                                        gridOwnership[nr][nc] = newId;
                                        gridOwnership[r][c] = newId;
                                        paths.push({
                                            id: newId,
                                            points: newPoints,
                                            heading: getHeadingFromDiff(nr - r, nc - c),
                                            state: "IDLE",
                                            animProgress: 0,
                                            originalPoints: []
                                        });
                                        unassigned.splice(i, 1);
                                        break;
                                    }
                                }
                            }
                        }
                    }
                }
            }

            assignSmartHeadings(paths, State.gridRows, State.gridCols);

            return { paths, gridOwnership };
        }

        // Rigorous orthogonal layout validator to completely prevent diagonal line artifacts
        function validatePaths(paths, mask, rows, cols) {
            let expectedCount = 0;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (mask[r]?.[c] === 1) {
                        expectedCount++;
                    }
                }
            }

            let visited = new Set();
            for (let p of paths) {
                if (p.points.length < 2) return false;
                for (let i = 0; i < p.points.length; i++) {
                    let pt = p.points[i];
                    if (pt.r < 0 || pt.r >= rows || pt.c < 0 || pt.c >= cols) return false;
                    if (mask[pt.r]?.[pt.c] !== 1) return false; // Out of bounds

                    if (i > 0) {
                        let prev = p.points[i - 1];
                        let dist = Math.abs(pt.r - prev.r) + Math.abs(pt.c - prev.c);
                        if (dist !== 1) return false; // Strictly non-diagonal jump block!
                    }
                    let key = `${pt.r},${pt.c}`;
                    if (visited.has(key)) return false; // Overlapping coordinate
                    visited.add(key);
                }
            }

            return visited.size === expectedCount;
        }

        // Raycast logic checker for virtual unblocked exit clearances
        function canPathEscapeVirtual(p, activePaths, rows, cols) {
            let head = p.points[p.points.length - 1];
            let dr = 0, dc = 0;
            if (p.heading === "UP") dr = -1;
            if (p.heading === "DOWN") dr = 1;
            if (p.heading === "LEFT") dc = -1;
            if (p.heading === "RIGHT") dc = 1;

            let checkR = head.r + dr;
            let checkC = head.c + dc;

            while (checkR >= 0 && checkR < rows && checkC >= 0 && checkC < cols) {
                // If checking out of solid obstacle pillar boundaries (value -1)
                if (State.gridMask[checkR]?.[checkC] === -1) {
                    return false; // Solid wall blocks escape path
                }

                let hit = activePaths.some(other => {
                    if (other.id === p.id) return false;
                    return other.points.some(pt => pt.r === checkR && pt.c === checkC);
                });
                if (hit) return false;
                checkR += dr;
                checkC += dc;
            }
            return true;
        }

        // Blazingly fast simulated solver using a 2D occupancy grid to ensure 100% solvability without deadlocks
        function isBoardFullySolvable(paths, rows, cols) {
            let occupancy = Array(rows).fill().map(() => Array(cols).fill(-1));
            paths.forEach(p => {
                p.points.forEach(pt => {
                    occupancy[pt.r][pt.c] = p.id;
                });
            });

            let activeSet = new Set(paths.map(p => p.id));
            let clearedCount = 0;
            let resolvedSomething = true;

            while (resolvedSomething) {
                resolvedSomething = false;

                for (let p of paths) {
                    if (!activeSet.has(p.id)) continue;

                    let head = p.points[p.points.length - 1];
                    let dr = 0, dc = 0;
                    if (p.heading === "UP") dr = -1;
                    if (p.heading === "DOWN") dr = 1;
                    if (p.heading === "LEFT") dc = -1;
                    if (p.heading === "RIGHT") dc = 1;

                    let checkR = head.r + dr;
                    let checkC = head.c + dc;
                    let canEscape = true;

                    while (checkR >= 0 && checkR < rows && checkC >= 0 && checkC < cols) {
                        if (State.gridMask[checkR]?.[checkC] === -1) {
                            canEscape = false;
                            break;
                        }
                        let occupiedId = occupancy[checkR][checkC];
                        if (occupiedId !== -1 && occupiedId !== p.id) {
                            canEscape = false;
                            break;
                        }
                        checkR += dr;
                        checkC += dc;
                    }

                    if (canEscape) {
                        p.points.forEach(pt => {
                            occupancy[pt.r][pt.c] = -1;
                        });
                        activeSet.delete(p.id);
                        clearedCount++;
                        resolvedSomething = true;
                        break;
                    }
                }
            }

            return clearedCount === paths.length;
        }

        // Multi-pass iterative unjamming algorithm that aggressively resolves deadlocked boards
        function runUnjammingSolvabilityTweak(paths, rows, cols, gridOwnership) {
            for (let pass = 0; pass < 5; pass++) {
                // Build a fresh occupancy grid for fast raycasting
                let occupancy = Array(rows).fill().map(() => Array(cols).fill(-1));
                let activeIds = new Set();
                paths.forEach(p => {
                    p.points.forEach(pt => { occupancy[pt.r][pt.c] = p.id; });
                    activeIds.add(p.id);
                });

                // Phase 1: Greedily clear all escapable paths
                let resolvedSomething = true;
                while (resolvedSomething) {
                    resolvedSomething = false;
                    for (let p of paths) {
                        if (!activeIds.has(p.id)) continue;
                        if (canEscapeOccupancy(p, occupancy, rows, cols)) {
                            p.points.forEach(pt => { occupancy[pt.r][pt.c] = -1; });
                            activeIds.delete(p.id);
                            resolvedSomething = true;
                            break;
                        }
                    }
                }

                if (activeIds.size === 0) return; // Fully solved!

                // Phase 2: For each remaining deadlocked path, try flipping its heading
                let anyFlipped = false;
                for (let p of paths) {
                    if (!activeIds.has(p.id)) continue;

                    let origHeading = p.heading;
                    let oppHeading = origHeading === "UP" ? "DOWN" : origHeading === "DOWN" ? "UP" : origHeading === "LEFT" ? "RIGHT" : "LEFT";

                    // Temporarily flip
                    p.heading = oppHeading;
                    p.points.reverse();
                    p.originalPoints = JSON.parse(JSON.stringify(p.points));

                    // Check if this path can now escape
                    if (canEscapeOccupancy(p, occupancy, rows, cols)) {
                        // Free its cells and mark cleared
                        p.points.forEach(pt => { occupancy[pt.r][pt.c] = -1; });
                        activeIds.delete(p.id);
                        anyFlipped = true;
                    } else {
                        // Revert the flip
                        p.heading = origHeading;
                        p.points.reverse();
                        p.originalPoints = JSON.parse(JSON.stringify(p.points));
                    }
                }

                if (activeIds.size === 0) return; // Fully solved after flips!
                if (!anyFlipped) return; // No progress possible, done
            }
        }

        // Fast occupancy-grid based escape check (O(grid_dimension) per call)
        function canEscapeOccupancy(p, occupancy, rows, cols) {
            let head = p.points[p.points.length - 1];
            let dr = 0, dc = 0;
            if (p.heading === "UP") dr = -1;
            if (p.heading === "DOWN") dr = 1;
            if (p.heading === "LEFT") dc = -1;
            if (p.heading === "RIGHT") dc = 1;

            let checkR = head.r + dr;
            let checkC = head.c + dc;

            while (checkR >= 0 && checkR < rows && checkC >= 0 && checkC < cols) {
                if (State.gridMask[checkR]?.[checkC] === -1) return false;
                let occupiedId = occupancy[checkR][checkC];
                if (occupiedId !== -1 && occupiedId !== p.id) return false;
                checkR += dr;
                checkC += dc;
            }
            return true;
        }

        function hasAnyDoubleSelfCollidingPath(paths, rows, cols) {
            return paths.some(p => {
                let len = p.points.length;
                if (len < 2) return false;

                let ptA = p.points[0];
                let ptA_next = p.points[1];
                let dirA = { r: ptA.r - ptA_next.r, c: ptA.c - ptA_next.c };
                let bodyA = p.points.slice(1);

                let ptB = p.points[len - 1];
                let ptB_prev = p.points[len - 2];
                let dirB = { r: ptB.r - ptB_prev.r, c: ptB.c - ptB_prev.c };
                let bodyB = p.points.slice(0, len - 1);

                let evalA = evaluateEndpoint(ptA, dirA, bodyA, rows, cols);
                let evalB = evaluateEndpoint(ptB, dirB, bodyB, rows, cols);

                return evalA.selfIntersect && evalB.selfIntersect;
            });
        }

        // Master Level Builder: Generates a valid unjammed board quickly
        function build100PackedLevel(forceNewGeneration = false) {
            if (!forceNewGeneration && Persistence.loadState()) {
                State.levelStartScore = State.score;
                resizeCanvas();
                updateDomUI();
                return;
            }

            const bounds = generateRandomGridDimensions(State.gridSizePreset, State.level);
            State.gridRows = bounds.rows;
            State.gridCols = bounds.cols;
            State.gridSize = Math.max(State.gridRows, State.gridCols);

            const topo = getTopologyForLevel(State.level, State.gridRows, State.gridCols);
            State.shapeName = topo.name;
            State.gridMask = topo.makeMask(State.gridRows, State.gridCols);

            resetCamera();
            resizeCanvas();

            // Generate board - retry up to 20 times until no self-colliding paths and fully solvable
            let result = null;
            for (let attempt = 0; attempt < 20; attempt++) {
                result = tryGenerateBoard();
                if (result && result.paths && result.paths.length > 0) {
                    runUnjammingSolvabilityTweak(result.paths, State.gridRows, State.gridCols, result.gridOwnership);
                    if (!hasAnyDoubleSelfCollidingPath(result.paths, State.gridRows, State.gridCols) &&
                        isBoardFullySolvable(result.paths, State.gridRows, State.gridCols)) {
                        break;
                    }
                }
            }

            if (result && result.paths && result.paths.length > 0) {
                State.paths = result.paths;
            } else {
                // Ultra-rare fallback: simple 8x8 square
                State.gridRows = 8;
                State.gridCols = 8;
                State.gridSize = 8;
                State.gridMask = TOPOLOGIES.SQUARE.makeMask(8, 8);
                State.shapeName = "Square Matrix";
                resetCamera();
                resizeCanvas();
                let fb = tryGenerateBoard();
                if (fb && fb.paths && isBoardFullySolvable(fb.paths, 8, 8)) {
                    runUnjammingSolvabilityTweak(fb.paths, 8, 8, fb.gridOwnership);
                    State.paths = fb.paths;
                } else {
                    State.paths = [];
                }
            }

            State.levelStartScore = State.score;
            State.lives = 3;
            Persistence.saveState();
            updateDomUI();
        }

        // Retrieves the exact grid cells currently occupied by a vector path, including movement-based animation shifts
        function getPathOccupiedCells(p) {
            if (p.state === "CLEARED") return [];
            if (p.state === "IDLE") return p.points;

            const cells = [];
            const len = p.points.length;
            const lastPt = p.points[len - 1];
            let dr = 0, dc = 0;
            if (p.heading === "UP") dr = -1;
            if (p.heading === "DOWN") dr = 1;
            if (p.heading === "LEFT") dc = -1;
            if (p.heading === "RIGHT") dc = 1;

            const startIdx = Math.floor(p.animProgress);
            const endIdx = Math.ceil((len - 1) + p.animProgress);

            for (let i = startIdx; i <= endIdx; i++) {
                if (i < len) {
                    cells.push(p.points[i]);
                } else {
                    const j = i - (len - 1);
                    cells.push({
                        r: lastPt.r + dr * j,
                        c: lastPt.c + dc * j
                    });
                }
            }
            return cells;
        }

        // Runtime gameplay active checker
        function getUnblockedPaths() {
            return State.paths.filter(p => {
                if (p.state !== "IDLE") return false;
                let head = p.points[p.points.length - 1];
                let dr = 0, dc = 0;
                if (p.heading === "UP") dr = -1;
                if (p.heading === "DOWN") dr = 1;
                if (p.heading === "LEFT") dc = -1;
                if (p.heading === "RIGHT") dc = 1;

                let checkR = head.r + dr;
                let checkC = head.c + dc;

                while (checkR >= 0 && checkR < State.gridRows && checkC >= 0 && checkC < State.gridCols) {
                    if (State.gridMask[checkR]?.[checkC] === -1) {
                        return false; // Solid wall blocks
                    }

                    let collision = State.paths.some(other => {
                        if (other.id === p.id || other.state === "CLEARED") return false;
                        let occupied = getPathOccupiedCells(other);
                        return occupied.some(pt => pt.r === checkR && pt.c === checkC);
                    });
                    if (collision) return false;
                    checkR += dr;
                    checkC += dc;
                }
                return true;
            });
        }

        function updateDomUI() {
            document.getElementById('level-display').innerText = `Level ${State.level}`;
            document.getElementById('score-display').innerText = State.score;

            const badge = document.getElementById('tier-badge');
            if (State.dailyPuzzleMode) {
                badge.innerText = 'DAILY';
                badge.style.color = '#d97706';
            } else {
                const diff = getDifficultyLabel(State.level);
                badge.innerText = diff.label;
                badge.style.color = diff.color;
            }


            for (let i = 1; i <= 3; i++) {
                const el = document.getElementById(`heart-${i}`);
                if (i <= State.lives) {
                    el.style.opacity = "1";
                    el.style.transform = "scale(1)";
                } else {
                    el.style.opacity = "0.15";
                    el.style.transform = "scale(0.85)";
                }
            }
        }

        function drawChevronArrowHead(x, y, heading, size, isSelected, pState) {
            ctx.save();
            ctx.translate(x, y);

            let angle = 0;
            if (heading === "UP") angle = -Math.PI / 2;
            if (heading === "DOWN") angle = Math.PI / 2;
            if (heading === "LEFT") angle = Math.PI;
            ctx.rotate(angle);

            let fillTop, fillBottom, strokeColor;

            if (pState === "CRASHING") {
                fillTop = "#f87171";     // Lighter red for top facet
                fillBottom = "#b91c1c";  // Darker red for bottom facet
                strokeColor = "#7f1d1d"; // Deep crimson outline
            } else if (isSelected) {
                fillTop = "#60a5fa";     // Lighter neon blue for top facet
                fillBottom = "#1d4ed8";  // Darker blue for bottom facet
                strokeColor = "#1e3a8a"; // Deep navy blue outline
            } else {
                fillTop = "#000000";
                fillBottom = "#000000";
                strokeColor = "#000000";
            }

            // Draw Top/Left Facet of the 3D Pyramid pointing outward (base at 0, tip at size)
            ctx.beginPath();
            ctx.moveTo(0, 0); // Base center
            ctx.lineTo(0, -size * 0.58); // Top corner
            ctx.lineTo(size, 0); // Tip pointing outward
            ctx.closePath();
            ctx.fillStyle = fillTop;
            ctx.fill();
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = Math.max(1.0, size * 0.08);
            ctx.lineJoin = "round";
            ctx.stroke();

            // Draw Bottom/Right Facet of the 3D Pyramid pointing outward (base at 0, tip at size)
            ctx.beginPath();
            ctx.moveTo(0, 0); // Base center
            ctx.lineTo(0, size * 0.58); // Bottom corner
            ctx.lineTo(size, 0); // Tip pointing outward
            ctx.closePath();
            ctx.fillStyle = fillBottom;
            ctx.fill();
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = Math.max(1.0, size * 0.08);
            ctx.lineJoin = "round";
            ctx.stroke();

            ctx.restore();
        }

        function drawEngine() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save(); // outer save — matches restore at end of function

            const cSize = State.cellSize;
            const ox = State.offsetX;
            const oy = State.offsetY;

            // 1. Draw grid cells based on custom mask topology (Optimized Batch Rendering)
            const rows = State.gridRows;
            const cols = State.gridCols;

            // Fill the grid bounding box with the void background first
            ctx.fillStyle = "#f8fafc";
            ctx.fillRect(ox, oy, cols * cSize, rows * cSize);

            // Batch draw active (1) cells
            ctx.fillStyle = "#ffffff";
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (State.gridMask[r]?.[c] === 1) {
                        ctx.fillRect(ox + c * cSize, oy + r * cSize, cSize, cSize);
                    }
                }
            }

            // Batch draw obstacle (-1) cells
            ctx.fillStyle = "#f1f5f9";
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (State.gridMask[r]?.[c] === -1) {
                        ctx.fillRect(ox + c * cSize + 1, oy + r * cSize + 1, cSize - 2, cSize - 2);
                    }
                }
            }

            // Batch draw grid lines for active cells in one stroke path
            ctx.strokeStyle = State.gridSize > 30 ? "rgba(241, 245, 249, 0.4)" : "#f1f5f9";
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (State.gridMask[r]?.[c] === 1) {
                        // Left border (if boundary or left neighbor not active)
                        if (c === 0 || State.gridMask[r]?.[c - 1] !== 1) {
                            ctx.moveTo(ox + c * cSize, oy + r * cSize);
                            ctx.lineTo(ox + c * cSize, oy + (r + 1) * cSize);
                        }
                        // Right border
                        ctx.moveTo(ox + (c + 1) * cSize, oy + r * cSize);
                        ctx.lineTo(ox + (c + 1) * cSize, oy + (r + 1) * cSize);

                        // Top border (if boundary or top neighbor not active)
                        if (r === 0 || State.gridMask[r - 1]?.[c] !== 1) {
                            ctx.moveTo(ox + c * cSize, oy + r * cSize);
                            ctx.lineTo(ox + (c + 1) * cSize, oy + r * cSize);
                        }
                        // Bottom border
                        ctx.moveTo(ox + c * cSize, oy + (r + 1) * cSize);
                        ctx.lineTo(ox + (c + 1) * cSize, oy + (r + 1) * cSize);
                    }
                }
            }
            ctx.stroke();

            // Draw boundaries and obstacle outlines
            ctx.strokeStyle = "#cbd5e1";
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (State.gridMask[r]?.[c] === -1) {
                        ctx.rect(ox + c * cSize + 1, oy + r * cSize + 1, cSize - 2, cSize - 2);
                    }
                }
            }
            ctx.stroke();

            // 2. Render Skinny Complex Winding Lines — clipped to board bounds so exit animation doesn't draw outside the grid
            ctx.save();
            ctx.beginPath();
            ctx.rect(ox, oy, cols * cSize, rows * cSize);
            ctx.clip();

            State.paths.forEach(p => {
                if (p.state === "CLEARED") return;

                let isSelected = (State.selectedPath && State.selectedPath.id === p.id) || (State.hintPathId === p.id);

                let strokeColor = "#112540"; // Premium Deep Navy Slate Blue
                let activeColor = "#3b82f6"; // Brilliant Neon Hover Highlight

                if (p.state === "CRASHING") {
                    strokeColor = "#ef4444";
                } else if (isSelected) {
                    strokeColor = activeColor;
                }

                // Red cell flash — fill occupied cells during the crash hold frames
                if (p.state === "CRASHING" && (p.crashFlashFrames || 0) > 0) {
                    ctx.fillStyle = "rgba(239, 68, 68, 0.35)";
                    getPathOccupiedCells(p).forEach(pt => {
                        if (pt.r >= 0 && pt.r < State.gridRows && pt.c >= 0 && pt.c < State.gridCols) {
                            ctx.fillRect(ox + pt.c * cSize, oy + pt.r * cSize, cSize, cSize);
                        }
                    });
                }

                // Sub-pixel lines sizing scaled dynamically for huge grids
                ctx.lineWidth = Math.max(1, cSize * 0.08); // Balanced, moderately thick vector paths
                ctx.lineJoin = "round";
                ctx.lineCap = "round";

                let fullTrack = [];
                p.points.forEach(pt => {
                    fullTrack.push({
                        x: ox + pt.c * cSize + cSize / 2,
                        y: oy + pt.r * cSize + cSize / 2
                    });
                });

                let len = p.points.length;
                let lastPt = p.points[len - 1];
                let dr = 0, dc = 0;
                if (p.heading === "UP") dr = -1;
                if (p.heading === "DOWN") dr = 1;
                if (p.heading === "LEFT") dc = -1;
                if (p.heading === "RIGHT") dc = 1;

                for (let j = 1; j <= Math.max(State.gridRows, State.gridCols) + 2; j++) {
                    fullTrack.push({
                        x: ox + (lastPt.c + dc * j) * cSize + cSize / 2,
                        y: oy + (lastPt.r + dr * j) * cSize + cSize / 2
                    });
                }

                let drawPoints = [];
                let totalSegLen = len - 1;

                if (p.state === "IDLE") {
                    drawPoints = fullTrack.slice(0, len);
                } else {
                    let dStart = p.animProgress;
                    let dEnd = totalSegLen + p.animProgress;
                    drawPoints = getSubTrackPoints(fullTrack, dStart, dEnd);
                }

                if (drawPoints.length >= 2) {
                    ctx.save();
                    if (isSelected && p.state !== "CRASHING") {
                        ctx.shadowBlur = 8;
                        ctx.shadowColor = "rgba(59, 130, 246, 0.4)";
                    }

                    ctx.beginPath();
                    ctx.moveTo(drawPoints[0].x, drawPoints[0].y);
                    for (let i = 1; i < drawPoints.length; i++) {
                        ctx.lineTo(drawPoints[i].x, drawPoints[i].y);
                    }
                    ctx.strokeStyle = strokeColor;
                    ctx.stroke();
                    ctx.restore();

                    // Trajectory ghost line — dashed ray from arrowhead toward board edge
                    // Shows the exact exit path so winding/loop shapes are never ambiguous
                    if (p.state === "IDLE") {
                        const headCell = p.points[p.points.length - 1];
                        let steps = 0;
                        let cr = headCell.r + dr;
                        let cc = headCell.c + dc;
                        while (cr >= 0 && cr < State.gridRows && cc >= 0 && cc < State.gridCols && State.gridMask[cr]?.[cc] !== -1) {
                            steps++;
                            cr += dr;
                            cc += dc;
                        }
                        if (steps > 0) {
                            const hx = ox + headCell.c * cSize + cSize / 2;
                            const hy = oy + headCell.r * cSize + cSize / 2;
                            ctx.save();
                            ctx.setLineDash([Math.max(2, cSize * 0.18), Math.max(2, cSize * 0.14)]);
                            ctx.lineWidth = Math.max(0.75, cSize * 0.045);
                            ctx.lineCap = "round";
                            ctx.strokeStyle = isSelected
                                ? "rgba(59, 130, 246, 0.55)"
                                : "rgba(17, 37, 64, 0.22)";
                            ctx.beginPath();
                            ctx.moveTo(hx, hy);
                            ctx.lineTo(hx + dc * steps * cSize, hy + dr * steps * cSize);
                            ctx.stroke();
                            ctx.setLineDash([]);
                            ctx.restore();
                        }
                    }

                    let headPos = drawPoints[drawPoints.length - 1];
