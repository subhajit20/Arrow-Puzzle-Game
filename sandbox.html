<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arrow Game — Pipeline Sandbox</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; height: 100vh; overflow: hidden; }
  #board-container { position: relative; background: #1e293b; border-radius: 12px; overflow: hidden; }
  canvas { display: block; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; }
  .badge-green  { background: #166534; color: #bbf7d0; }
  .badge-yellow { background: #713f12; color: #fef08a; }
  .badge-red    { background: #7f1d1d; color: #fecaca; }
  .badge-blue   { background: #1e3a5f; color: #bfdbfe; }
  .badge-gray   { background: #334155; color: #cbd5e1; }

  .stat-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px solid #1e293b; font-size: 13px; }
  .stat-label { color: #94a3b8; }
  .stat-value { font-weight: 600; color: #f1f5f9; }

  .log-entry { font-size: 11px; padding: 3px 0; border-bottom: 1px solid #1e293b; line-height: 1.5; }
  .log-ok   { color: #4ade80; }
  .log-warn { color: #facc15; }
  .log-err  { color: #f87171; }
  .log-info { color: #94a3b8; }

  .pill-btn { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid #334155; background: #1e293b; color: #94a3b8; transition: all 0.15s; }
  .pill-btn.active { background: #3b82f6; border-color: #3b82f6; color: #fff; }
  .pill-btn:hover:not(.active) { background: #334155; color: #e2e8f0; }

  .gen-btn { background: #3b82f6; color: #fff; border: none; padding: 8px 20px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; transition: background 0.15s; width: 100%; }
  .gen-btn:hover { background: #2563eb; }
  .gen-btn:disabled { background: #334155; color: #64748b; cursor: default; }

  input[type=range] { width: 100%; accent-color: #3b82f6; }
  input[type=number] { background: #1e293b; border: 1px solid #334155; color: #f1f5f9; border-radius: 6px; padding: 4px 8px; font-size: 13px; width: 64px; text-align: center; }

  .panel { background: #1e293b; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .panel-title { font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }

  #overlay-canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #334155; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div style="display:flex; height:100vh; gap:10px; padding:10px; box-sizing:border-box;">

  <!-- ── LEFT PANEL ─────────────────────────────────────── -->
  <div style="width:260px; flex-shrink:0; display:flex; flex-direction:column; gap:0; overflow-y:auto;">

    <div style="font-size:16px; font-weight:800; color:#f1f5f9; margin-bottom:10px; letter-spacing:-0.01em;">
      🎮 Pipeline Sandbox
    </div>

    <!-- Controls -->
    <div class="panel">
      <div class="panel-title">Generate</div>

      <div style="margin-bottom:10px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
          <span style="font-size:12px; color:#94a3b8;">Level</span>
          <input type="number" id="levelInput" min="1" max="100" value="76">
        </div>
        <input type="range" id="levelSlider" min="1" max="100" value="76">
      </div>

      <div style="margin-bottom:10px;">
        <div style="font-size:12px; color:#94a3b8; margin-bottom:6px;">Difficulty tier</div>
        <div style="display:flex; flex-wrap:wrap; gap:4px;" id="tierPicker">
          <button class="pill-btn active" data-tier="AUTO">AUTO</button>
          <button class="pill-btn" data-tier="EASY">EASY</button>
          <button class="pill-btn" data-tier="NORMAL">NORMAL</button>
          <button class="pill-btn" data-tier="HARD">HARD</button>
          <button class="pill-btn" data-tier="EXPERT">EXPERT</button>
          <button class="pill-btn" data-tier="TITAN">TITAN</button>
        </div>
      </div>

      <div style="margin-bottom:10px;">
        <label style="display:flex; align-items:center; gap:6px; font-size:12px; color:#94a3b8; cursor:pointer;">
          <input type="checkbox" id="overlayToggle" checked style="accent-color:#3b82f6;">
          Show debug overlay
        </label>
      </div>

      <button class="gen-btn" id="genBtn" onclick="sandboxGenerate()">Generate Board</button>
    </div>

    <!-- Load JSON Board -->
    <div class="panel">
      <div class="panel-title">Load JSON Board</div>
      <div style="margin-bottom:8px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
          <span style="font-size:12px; color:#94a3b8;">Level</span>
          <input type="number" id="jsonLevelInput" min="1" max="100" value="1"
                 style="background:#0f172a; border:1px solid #334155; color:#f1f5f9; border-radius:6px; padding:4px 8px; font-size:13px; width:64px; text-align:center;">
        </div>
      </div>
      <button class="gen-btn" onclick="sandboxLoadJSON()" style="background:#0e7490;">Load boards/level_NNN.json</button>
      <div id="jsonLoadStatus" style="font-size:11px; color:#475569; margin-top:6px;">—</div>
    </div>

    <!-- Stats -->
    <div class="panel" id="statsPanel">
      <div class="panel-title">Last Generation</div>
      <div id="statsContent" style="color:#475569; font-size:12px;">No board generated yet.</div>
    </div>

    <!-- Export Board -->
    <div class="panel">
      <div class="panel-title">Export → boards-data.js</div>

      <div style="display:flex; align-items:center; gap:6px; margin-bottom:8px;">
        <span style="font-size:12px; color:#94a3b8; white-space:nowrap;">Level key</span>
        <input type="number" id="exportLevelKey" min="1" value="1"
               style="background:#0f172a; border:1px solid #334155; color:#f1f5f9; border-radius:6px; padding:4px 8px; font-size:13px; width:64px; text-align:center;">
        <button class="gen-btn" onclick="exportBoard()"
                style="flex:1; background:#059669; font-size:12px; padding:6px 10px;">
          Export
        </button>
      </div>

      <div id="exportStatus" style="font-size:11px; color:#475569; margin-bottom:6px;">Generate a board first.</div>

      <textarea id="exportOutput" readonly
                style="width:100%; height:110px; background:#0f172a; border:1px solid #334155;
                       color:#94a3b8; border-radius:6px; font-size:10px; font-family:monospace;
                       padding:6px; resize:vertical; box-sizing:border-box; display:none;"></textarea>

      <button id="exportCopyBtn" onclick="copyExport()"
              style="display:none; width:100%; margin-top:6px; background:#1e3a5f; border:none;
                     color:#bfdbfe; padding:5px; border-radius:6px; font-size:12px; cursor:pointer;">
        Copy to clipboard
      </button>
    </div>

    <!-- Pipeline Log -->
    <div class="panel" style="flex:1; min-height:80px;">
      <div class="panel-title">Pipeline Log</div>
      <div id="pipelineLog" style="max-height:220px; overflow-y:auto;"></div>
    </div>

  </div>

  <!-- ── BOARD AREA ──────────────────────────────────────── -->
  <div style="flex:1; display:flex; flex-direction:column; gap:8px; min-width:0;">

    <!-- Board info bar -->
    <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
      <span id="boardLabel" style="font-size:13px; color:#64748b;">No board</span>
      <span id="boardBadges" style="display:flex; gap:6px;"></span>
      <span id="genTime" style="margin-left:auto; font-size:11px; color:#475569;"></span>
    </div>

    <!-- Canvas container -->
    <div id="board-container" style="flex:1; min-height:0; position:relative;">
      <canvas id="gameCanvas" style="position:absolute; top:0; left:0; z-index:1;"></canvas>
      <canvas id="overlay-canvas" style="position:absolute; top:0; left:0; z-index:2; pointer-events:none;"></canvas>

    </div>

  </div>

</div>

<!-- New class-based engine -->
<script src="js/Grid.js"></script>
<script src="js/Path.js"></script>
<script src="js/SolvabilityOracle.js"></script>
<script src="js/ZoneMap.js"></script>
<script src="js/RCBuilder.js"></script>
<script src="js/DifficultyEngine.js"></script>
<script src="js/Validator.js"></script>
<script src="js/GridShape.js"></script>
<script src="js/Generator.js"></script>
<script src="js/Camera.js"></script>
<script src="js/Renderer.js"></script>
<script src="js/AnimationEngine.js"></script>
<script src="js/InputHandler.js"></script>
<script src="js/AudioEngine.js"></script>
<script src="js/GameController.js"></script>
<script src="js/Persistence.js"></script>
<script src="js/BoardLoader.js"></script>
<script src="js/DailyPuzzle.js"></script>
<script src="js/boards-data.js"></script>

<script>
// =============================================================================
// Sandbox — class-based pipeline tester
// =============================================================================

// ── Instantiate classes ────────────────────────────────────────────────────
const oracle     = new SolvabilityOracle();
const builder    = new RCBuilder(oracle);
const difficulty = new DifficultyEngine();
const validator  = new Validator(oracle);
const generator  = new Generator(builder, difficulty, validator);
const boardsData = typeof BOARDS !== 'undefined' ? BOARDS : {};
const loader     = new BoardLoader(boardsData);

const canvas      = document.getElementById('gameCanvas');
const containerEl = document.getElementById('board-container');
const camera      = new Camera(canvas);
const renderer    = new Renderer(canvas, camera);
const animation   = new AnimationEngine(renderer);
const audio       = new AudioEngine();
const gc          = new GameController(null, renderer, audio, new Persistence(), animation);

// ── Sandbox state ─────────────────────────────────────────────────────────
const SB = {
  tier: 'AUTO',
  log:  [],
  lastGenMs: 0,
  currentBoard: null,
};

// ── Tier picker ───────────────────────────────────────────────────────────
document.getElementById('tierPicker').addEventListener('click', e => {
  const btn = e.target.closest('[data-tier]');
  if (!btn) return;
  SB.tier = btn.dataset.tier;
  document.querySelectorAll('#tierPicker .pill-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
});

// ── Level slider ↔ input ──────────────────────────────────────────────────
const levelSlider = document.getElementById('levelSlider');
const levelInput  = document.getElementById('levelInput');
levelSlider.addEventListener('input', () => { levelInput.value = levelSlider.value; });
levelInput.addEventListener('input', () => {
  const v = Math.max(1, Math.min(100, parseInt(levelInput.value) || 1));
  levelSlider.value = v; levelInput.value = v;
});

// ── Console interceptor ───────────────────────────────────────────────────
const _origWarn = console.warn.bind(console);
const _origErr  = console.error.bind(console);
const _origLog  = console.log.bind(console);
function interceptConsole() {
  SB.log = [];
  console.warn  = (...a) => { SB.log.push({ type:'warn', msg: a.join(' ') }); _origWarn(...a); };
  console.error = (...a) => { SB.log.push({ type:'err',  msg: a.join(' ') }); _origErr(...a);  };
  console.log   = (...a) => { SB.log.push({ type:'info', msg: a.join(' ') }); _origLog(...a);  };
}
function restoreConsole() {
  console.warn  = _origWarn;
  console.error = _origErr;
  console.log   = _origLog;
}

// ── Generate ──────────────────────────────────────────────────────────────
function sandboxGenerate() {
  const btn = document.getElementById('genBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Generating…';

  setTimeout(() => {
    try { _doGenerate(); }
    finally { btn.disabled = false; btn.textContent = 'Generate Board'; }
  }, 30);
}

function _doGenerate() {
  const level   = parseInt(levelInput.value) || 76;
  const sizes   = generator.sizesForLevel(level);
  const size    = sizes[Math.floor(Math.random() * sizes.length)];
  const tier    = SB.tier !== 'AUTO'
    ? SB.tier
    : difficulty.selectTier(level, []);

  interceptConsole();
  const t0 = performance.now();
  const board = generator.build(size.rows, size.cols, level, 4);
  SB.lastGenMs = Math.round(performance.now() - t0);
  restoreConsole();

  if (!board) {
    document.getElementById('boardLabel').textContent = 'Generation failed';
    document.getElementById('statsContent').innerHTML = '<span style="color:#f87171">No board produced.</span>';
    renderLog();
    return;
  }

  SB.currentBoard = board;
  gc.board = board;

  renderer.resize(containerEl, board.grid.rows, board.grid.cols);
  animation.stop();
  animation.start(board, gc);

  updateUI(board);
  renderLog();
}

// ── Load pre-built board ──────────────────────────────────────────────────
function sandboxLoadJSON() {
  const level    = parseInt(document.getElementById('jsonLevelInput').value) || 1;
  const statusEl = document.getElementById('jsonLoadStatus');

  const board = loader.load(level);
  if (!board) {
    statusEl.textContent = `No pre-built board for level ${level}`;
    statusEl.style.color = '#f87171';
    return;
  }

  SB.currentBoard = board;
  gc.board = board;
  renderer.resize(containerEl, board.grid.rows, board.grid.cols);
  animation.stop();
  animation.start(board, gc);

  statusEl.textContent = `Loaded level ${level} — ${board.paths.length} paths`;
  statusEl.style.color = '#4ade80';
  updateUI(board);
}

// ── Stats UI ──────────────────────────────────────────────────────────────
const TIER_COLOR = { EASY:'badge-blue', NORMAL:'badge-green', HARD:'badge-yellow', EXPERT:'badge-red', TITAN:'badge-red' };

function updateUI(board) {
  const paths      = board.paths;
  const grid       = board.grid;
  const totalNodes = (grid.rows + 1) * (grid.cols + 1);
  const usedNodes  = paths.reduce((s, p) => s + p.nodes.length, 0);
  const coverage   = Math.round(usedNodes / totalNodes * 100);
  const tier       = board.difficulty || 'NORMAL';

  document.getElementById('boardLabel').textContent =
    `${grid.rows}×${grid.cols} grid · Level ${parseInt(levelInput.value) || 76}`;

  document.getElementById('boardBadges').innerHTML =
    `<span class="badge ${TIER_COLOR[tier] || 'badge-gray'}">${tier}</span>` +
    `<span class="badge badge-gray">${paths.length} paths</span>` +
    `<span class="badge badge-gray" style="color:${coverage===100?'#4ade80':coverage>=95?'#fbbf24':'#f87171'}">${coverage}% coverage</span>`;

  document.getElementById('genTime').textContent = SB.lastGenMs
    ? `Generated in ${SB.lastGenMs}ms` : '';

  document.getElementById('statsContent').innerHTML = `
    <div class="stat-row"><span class="stat-label">Grid</span><span class="stat-value">${grid.rows}×${grid.cols}</span></div>
    <div class="stat-row"><span class="stat-label">Paths</span><span class="stat-value">${paths.length}</span></div>
    <div class="stat-row"><span class="stat-label">Coverage</span><span class="stat-value" style="color:${coverage===100?'#4ade80':'#fbbf24'}">${coverage}%</span></div>
    <div class="stat-row"><span class="stat-label">Difficulty</span><span class="stat-value">${tier}</span></div>
    <div class="stat-row"><span class="stat-label">Min path</span><span class="stat-value">${Math.min(...paths.map(p=>p.nodes.length))} nodes</span></div>
    <div class="stat-row"><span class="stat-label">Max path</span><span class="stat-value">${Math.max(...paths.map(p=>p.nodes.length))} nodes</span></div>
    <div class="stat-row"><span class="stat-label">Gen time</span><span class="stat-value">${SB.lastGenMs}ms</span></div>
  `;
}

function renderLog() {
  const logEl = document.getElementById('pipelineLog');
  if (!SB.log.length) {
    logEl.innerHTML = '<span style="color:#475569; font-size:11px;">No log entries.</span>';
    return;
  }
  logEl.innerHTML = SB.log.map(e => {
    const cls  = e.type === 'err' ? 'log-err' : e.type === 'warn' ? 'log-warn' : 'log-info';
    const icon = e.type === 'err' ? '✕' : e.type === 'warn' ? '⚠' : '·';
    const msg  = e.msg.length > 100 ? e.msg.slice(0, 97) + '…' : e.msg;
    return `<div class="log-entry ${cls}">${icon} ${msg}</div>`;
  }).join('');
  logEl.scrollTop = logEl.scrollHeight;
}

// ── Export ────────────────────────────────────────────────────────────────
function exportBoard() {
  const statusEl = document.getElementById('exportStatus');
  const outputEl = document.getElementById('exportOutput');
  const copyBtn  = document.getElementById('exportCopyBtn');

  if (!SB.currentBoard) {
    statusEl.textContent = 'No board — generate one first.';
    statusEl.style.color = '#f87171';
    outputEl.style.display = 'none';
    copyBtn.style.display  = 'none';
    return;
  }

  const levelKey = parseInt(document.getElementById('exportLevelKey').value) || 1;
  const board    = SB.currentBoard;
  const entry    = loader.export(board, levelKey);

  const totalNodes = (board.grid.rows + 1) * (board.grid.cols + 1);
  const usedNodes  = board.paths.reduce((s, p) => s + p.nodes.length, 0);
  const coverage   = Math.round(usedNodes / totalNodes * 100);

  outputEl.value         = entry;
  outputEl.style.display = 'block';
  copyBtn.style.display  = 'block';
  statusEl.textContent   = `${board.paths.length} paths · ${board.grid.rows}×${board.grid.cols} · ${coverage}% coverage`;
  statusEl.style.color   = coverage === 100 ? '#4ade80' : coverage >= 95 ? '#fbbf24' : '#f87171';
}

function copyExport() {
  const outputEl = document.getElementById('exportOutput');
  outputEl.select();
  outputEl.setSelectionRange(0, 99999);
  navigator.clipboard.writeText(outputEl.value).then(() => {
    const btn = document.getElementById('exportCopyBtn');
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = 'Copy to clipboard'; }, 1500);
  });
}

// ── Resize ────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  if (SB.currentBoard) {
    renderer.resize(containerEl, SB.currentBoard.grid.rows, SB.currentBoard.grid.cols);
  }
});

// ── Init ──────────────────────────────────────────────────────────────────
window.onload = () => {
  animation.start({ grid: new Grid(48, 36), paths: [], mask: null }, gc);
  sandboxGenerate();
};
</script>
</body>
</html>
