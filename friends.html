<!DOCTYPE html>
<html lang="en" style="height:-webkit-fill-available;">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="VECTO">
    <meta name="theme-color" content="#0f172a">
    <title>VECTO: Play with Friends</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            user-select: none;
            -webkit-user-select: none;
            height: 100svh !important;
            min-height: -webkit-fill-available;
        }

        .glow-btn:active {
            transform: scale(0.96);
        }

        .glow-btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        #join-section {
            display: grid;
            grid-template-rows: 0fr;
            opacity: 0;
            transition: grid-template-rows 0.25s ease, opacity 0.25s ease, margin 0.25s ease;
            margin-top: 0;
        }

        #join-section.open {
            grid-template-rows: 1fr;
            opacity: 1;
            margin-top: 0.75rem;
        }

        #join-section>div {
            overflow: hidden;
        }

        #code-input {
            text-transform: uppercase;
            letter-spacing: 0.35em;
        }

        #code-input::placeholder {
            letter-spacing: 0.2em;
        }

        #countdown-num {
            font-variant-numeric: tabular-nums;
        }

        .shake {
            animation: shake 0.4s;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0)
            }

            25% {
                transform: translateX(-6px)
            }

            75% {
                transform: translateX(6px)
            }
        }

        .prog-fill {
            transition: width 0.25s ease;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(6, 78, 59, 0.15);
            border-top-color: #10b981;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0.4rem auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Live race-event cues. These live ONLY on the opponent strip and the
           top-edge banner — never over the board — so they never interrupt play. */
        @keyframes marker-pulse {
            0%   { transform: scale(1); }
            40%  { transform: scale(1.5); }
            100% { transform: scale(1); }
        }
        .fx-pulse { animation: marker-pulse 0.45s ease-out; }

        @keyframes marker-wipeout {
            0%, 100% { transform: translateX(0); }
            20%      { transform: translateX(-2px); }
            40%      { transform: translateX(2px); }
            60%      { transform: translateX(-2px); }
            80%      { transform: translateX(2px); }
        }
        .fx-wipeout {
            animation: marker-wipeout 0.5s ease-in-out;
            box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.7) !important;
        }

        #race-event-banner {
            transition: opacity 0.3s ease, transform 0.3s ease;
            opacity: 0;
            transform: translate(-50%, -8px);
        }
        #race-event-banner.show { opacity: 1; transform: translate(-50%, 0); }
    </style>
</head>

<body class="w-screen flex flex-col justify-center items-center p-4 gap-3 md:gap-4 bg-slate-100"
    style="padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));">

    <!-- Logo -->
    <div id="brand" class="text-center">
        <div class="text-2xl md:text-3xl font-extrabold text-[#112540] tracking-tight">VECTO</div>
        <div class="text-[9px] md:text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">Play with
            Friends</div>
    </div>

    <!-- ════════════════ VIEW: ENTRY ════════════════ -->
    <div id="view-entry" class="w-full max-w-sm flex flex-col items-center gap-3">
        <div class="w-full rounded-2xl p-4 md:p-5 shadow-xl"
            style="background: linear-gradient(135deg, #6ee7b7 0%, #10b981 45%, #0d9488 100%);">
            <div class="flex items-center justify-between mb-3">
                <span class="text-[9px] font-extrabold text-emerald-950/60 uppercase tracking-widest">Play with
                    Friends</span>
                <span class="text-sm">👥</span>
            </div>
            <label for="name-input"
                class="block text-[11px] font-bold text-emerald-950/70 uppercase tracking-wide mb-1">Your name</label>
            <input id="name-input" type="text" maxlength="16" autocomplete="off" spellcheck="false"
                placeholder="Enter your name"
                class="w-full py-2.5 px-3 font-bold text-sm rounded-xl outline-none border-2 border-transparent focus:border-emerald-900/40 transition-colors"
                style="background: rgba(255,255,255,0.85); color: #064e3b;">
            <div id="name-error" class="text-[11px] font-semibold text-red-800 mt-1 h-3.5"></div>
            <button id="create-btn" onclick="onCreate()"
                class="mt-1 w-full py-2.5 font-bold text-sm rounded-xl tracking-wide transition-all duration-200 glow-btn"
                style="background: rgba(6,78,59,0.85); color: #d1fae5;">
                Create a Room
            </button>
            <button id="join-toggle-btn" onclick="onJoinToggle()"
                class="mt-2 w-full py-2.5 font-bold text-sm rounded-xl tracking-wide transition-all duration-200 glow-btn border"
                style="background: rgba(255,255,255,0.18); color: #064e3b; border-color: rgba(6,78,59,0.3);">
                Join a Room
            </button>
            <div id="join-section">
                <div>
                    <label for="code-input"
                        class="block text-[11px] font-bold text-emerald-950/70 uppercase tracking-wide mb-1">Room
                        code</label>
                    <input id="code-input" type="text" maxlength="6" autocomplete="off" spellcheck="false"
                        inputmode="text" placeholder="ABCDEF"
                        class="w-full py-2.5 px-3 font-extrabold text-center text-base rounded-xl outline-none border-2 border-transparent focus:border-emerald-900/40 transition-colors"
                        style="background: rgba(255,255,255,0.85); color: #064e3b;">
                    <div id="code-error" class="text-[11px] font-semibold text-red-800 mt-1 h-3.5"></div>
                    <button id="join-confirm-btn" onclick="onJoinConfirm()"
                        class="mt-1 w-full py-2.5 font-bold text-sm rounded-xl tracking-wide transition-all duration-200 glow-btn"
                        style="background: rgba(6,78,59,0.85); color: #d1fae5;">
                        Join Room →
                    </button>
                </div>
            </div>
        </div>
        <div id="conn-status" class="text-[11px] font-semibold text-slate-400 h-4"></div>
        <button onclick="window.location.href='index.html'"
            class="text-xs font-bold text-slate-400 hover:text-slate-600 transition-colors tracking-wide">←
            Back</button>
    </div>

    <!-- ════════════════ VIEW: LOBBY ════════════════ -->
    <div id="view-lobby" class="hidden w-full max-w-sm flex flex-col items-center gap-3">
        <div class="w-full rounded-2xl p-4 md:p-5 shadow-xl"
            style="background: linear-gradient(135deg, #6ee7b7 0%, #10b981 45%, #0d9488 100%);">
            <div class="flex items-center justify-between mb-2">
                <span class="text-[9px] font-extrabold text-emerald-950/60 uppercase tracking-widest">Room</span>
                <span id="lobby-status-pill"
                    class="text-[9px] font-extrabold px-2 py-0.5 rounded-full uppercase tracking-wide"
                    style="background: rgba(6,78,59,0.25); color: #064e3b;">Lobby</span>
            </div>
            <div class="rounded-xl p-3 mb-3 flex items-center justify-between"
                style="background: rgba(255,255,255,0.85);">
                <div>
                    <div class="text-[10px] font-bold text-emerald-900/60 uppercase tracking-wide">Room code</div>
                    <div id="lobby-code" class="text-2xl font-extrabold text-emerald-950"
                        style="letter-spacing: 0.18em;">——————</div>
                </div>
                <button id="copy-btn" onclick="copyCode()"
                    class="px-3 py-2 text-xs font-bold rounded-lg glow-btn transition-all"
                    style="background: rgba(6,78,59,0.85); color: #d1fae5;">Copy code</button>
            </div>
            <div class="flex items-center justify-between mb-1">
                <span class="text-[11px] font-bold text-emerald-950/70 uppercase tracking-wide">Players</span>
                <span id="lobby-count" class="text-[11px] font-bold text-emerald-950/70">0 / 4</span>
            </div>
            <div id="lobby-players" class="space-y-1.5 mb-3"></div>
            <!-- Rounds selector (host only) -->
            <div id="rounds-select" class="hidden mb-3">
                <div class="text-[11px] font-bold text-emerald-950/70 uppercase tracking-wide mb-1.5">Rounds</div>
                <div id="rounds-options" class="flex gap-2"></div>
            </div>
            <div id="lobby-countdown" class="hidden text-center py-2 mb-2">
                <div id="countdown-label" class="text-[11px] font-bold text-emerald-900/70 uppercase tracking-widest">
                    Get ready</div>
                <div id="countdown-num" class="text-4xl font-extrabold text-emerald-950">3</div>
            </div>
            <button id="start-btn" onclick="onStart()"
                class="w-full py-2.5 font-bold text-sm rounded-xl tracking-wide transition-all duration-200 glow-btn"
                style="background: rgba(6,78,59,0.85); color: #d1fae5;">Start Game</button>
            <div id="waiting-msg" class="hidden text-center text-xs font-semibold text-emerald-900/70 py-2.5">
                Waiting for the host to start…
            </div>
        </div>
        <button onclick="leaveRoom()"
            class="text-xs font-bold text-slate-400 hover:text-slate-600 transition-colors tracking-wide">← Leave
            room</button>
    </div>

    <!-- ════════════════ VIEW: RACE (full-screen board) ════════════════ -->
    <div id="view-race" class="hidden fixed inset-0 z-40 bg-white">
        <!-- Full-bleed board — no card, fills the screen like the main game. -->
        <div id="board-container" class="absolute inset-0 flex justify-center items-center overflow-hidden">
            <canvas id="gameCanvas" class="w-full h-full block"></canvas>
        </div>

        <!-- Top HUD overlay: timer + lives. -->
        <div class="absolute top-0 left-0 right-0 px-3 pt-3 pointer-events-none"
            style="padding-top: max(12px, env(safe-area-inset-top));">
            <div class="flex items-center justify-between">
                <div id="race-timer"
                    class="bg-white/85 backdrop-blur px-3 py-1 rounded-full shadow-sm text-sm font-extrabold text-slate-700"
                    style="font-variant-numeric: tabular-nums;">2:00</div>
                <div id="race-round"
                    class="bg-white/85 backdrop-blur px-3 py-1 rounded-full shadow-sm text-xs font-extrabold text-slate-600">
                    Round 1/1</div>
                <div class="flex items-center gap-1 bg-white/85 backdrop-blur px-2 py-1 rounded-full shadow-sm">
                    <div id="heart-1" class="text-rose-500 text-sm transition-all duration-300 transform scale-100">❤️
                    </div>
                    <div id="heart-2" class="text-rose-500 text-sm transition-all duration-300 transform scale-100">❤️
                    </div>
                    <div id="heart-3" class="text-rose-500 text-sm transition-all duration-300 transform scale-100">❤️
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom overlay: live player / opponent progress bars. -->
        <div class="absolute bottom-0 left-0 right-0 px-3 pb-3 flex flex-col gap-1 pointer-events-none"
            style="padding-bottom: max(12px, env(safe-area-inset-bottom));">
            <div class="flex justify-end">
                <button id="fx-toggle" type="button" title="Toggle race effects"
                    class="pointer-events-auto bg-white/85 backdrop-blur w-7 h-7 rounded-full shadow-sm text-sm flex items-center justify-center">✨</button>
            </div>
            <div id="race-opponents" class="space-y-1"></div>
        </div>

        <!-- Live lead-change banner — top edge, taps pass through to the board. -->
        <div id="race-event-banner"
            class="absolute top-16 left-1/2 px-3 py-1.5 rounded-full text-xs font-extrabold shadow-lg z-10 pointer-events-none"
            style="background:#1e293b;color:#e2e8f0;"></div>

        <!-- "You finished" banner -->
        <div id="race-finish-banner"
            class="hidden absolute top-28 left-1/2 -translate-x-1/2 px-4 py-2 rounded-xl text-sm font-extrabold shadow-lg z-10"
            style="background:#064e3b;color:#d1fae5;"></div>

        <!-- Round-result / game-over overlay (filled by JS) -->
        <div id="race-standings"
            class="hidden absolute inset-0 bg-white/95 backdrop-blur-md flex flex-col justify-center items-center gap-3 z-20 p-6 overflow-y-auto">
        </div>
    </div>

    <!-- ── Game engine (subset; no generator — boards come from the server) ── -->
    <script src="js/Grid.js"></script>
    <script src="js/Path.js"></script>
    <script src="js/SolvabilityOracle.js"></script>
    <script src="js/Camera.js"></script>
    <script src="js/Renderer.js"></script>
    <script src="js/AnimationEngine.js"></script>
    <script src="js/InputHandler.js"></script>
    <script src="js/AudioEngine.js"></script>
    <script src="js/GameController.js"></script>
    <script src="js/BoardLoader.js"></script>
    <script src="js/RaceClient.js"></script>
    <script src="js/NetClient.js"></script>

    <script>
        // ── Config ──────────────────────────────────────────────────────────
        const params = new URLSearchParams(location.search);
        // Deployed backend (Render). Override with ?server=http://localhost:3001 for local dev. https://arrow-puzzle-backend.onrender.com
        const SERVER_URL = params.get('server') || localStorage.getItem('vecto_server_url') || 'https://arrow-puzzle-backend.onrender.com';
        // WebSocket endpoint — http→ws, https→wss.
        const WS_URL = SERVER_URL.replace(/^http/i, 'ws');
        const NAME_KEY = 'vecto_player_name';

        // ── DOM ─────────────────────────────────────────────────────────────
        const $ = (id) => document.getElementById(id);
        const views = { entry: $('view-entry'), lobby: $('view-lobby'), race: $('view-race') };
        const nameInput = $('name-input');
        const nameError = $('name-error');
        const codeInput = $('code-input');
        const codeError = $('code-error');
        const joinSection = $('join-section');
        const joinToggle = $('join-toggle-btn');
        const connStatus = $('conn-status');

        // ── State ───────────────────────────────────────────────────────────
        let net = null;                 // NetClient (lazy)
        let race = null;                 // RaceClient (lazy)
        const progress = {};               // playerId → { cleared, total }
        const prevCleared = {};            // playerId → last seen cleared count (event detection)
        const fx = {};                     // playerId → transient marker effect for next render
        let leaderId = null;               // current front-runner (for lead-change banner)
        let eventsMuted = false;           // "reduce distractions" toggle
        const ROUND_OPTIONS = [1, 3, 5, 7];
        const state = { code: null, playerId: null, room: null, board: null, isHost: false, finished: false, rounds: 3 };

        // Renders the rounds picker into a container and highlights the selection.
        function renderRoundsSelector(containerId) {
            const el = $(containerId);
            if (!el) return;
            el.innerHTML = ROUND_OPTIONS.map((n) => {
                const active = n === state.rounds;
                return `<button onclick="setRounds(${n})" data-n="${n}"
                    class="rounds-btn flex-1 py-2 rounded-lg text-sm font-extrabold transition-all glow-btn"
                    style="background:${active ? 'rgba(6,78,59,0.9)' : 'rgba(255,255,255,0.6)'};color:${active ? '#d1fae5' : '#064e3b'};">${n}</button>`;
            }).join('');
        }
        function setRounds(n) {
            state.rounds = n;
            renderRoundsSelector('rounds-options');     // lobby
            renderRoundsSelector('gameover-rounds');     // game-over overlay (if present)
        }

        function showView(name) {
            for (const k in views) views[k].classList.toggle('hidden', k !== name);
            $('brand').classList.toggle('hidden', name === 'race'); // give the board more room
        }

        // Name prefill + persistence.
        nameInput.value = (localStorage.getItem(NAME_KEY) || '').slice(0, 16);
        nameInput.addEventListener('input', () => { nameError.innerText = ''; localStorage.setItem(NAME_KEY, nameInput.value.trim()); });
        function requireName() {
            const name = nameInput.value.trim();
            if (!name) { nameError.innerText = 'Please enter a name first'; nameInput.focus(); return null; }
            localStorage.setItem(NAME_KEY, name);
            return name;
        }

        // ── Net (WebSocket) ──────────────────────────────────────────────────
        function ensureNet() {
            if (net) return net;
            net = new NetClient(WS_URL);

            net.onStatus = (s) => {
                if (s === 'open') connStatus.innerText = '';
                if (s === 'error') connStatus.innerText = `Can't reach server at ${SERVER_URL}`;
                if (s === 'close') connStatus.innerText = 'Disconnected from server';
            };

            net.on('room:update', (m) => {
                state.room = m.room; syncHostFlag(); renderLobby();
                if (m.room.status === 'active' || m.room.status === 'finished') renderOpponents();
            });
            net.on('race:generating', (m) => { state.round = m.round; state.totalRounds = m.totalRounds; showGenerating(); });
            net.on('race:countdown', (m) => { state.round = m.round; state.totalRounds = m.totalRounds; startCountdown(m.startAt); });
            net.on('race:start', (m) => {
                state.board = m.board; if (m.room) state.room = m.room;
                state.endsAt = m.endsAt; state.round = m.round; state.totalRounds = m.totalRounds;
                onRaceStart();
            });

            // Opponent progress (ephemeral).
            net.on('race:progress', (m) => {
                applyProgress(m.playerId, m.cleared, m.total);
            });
            net.on('race:placement', () => { /* room:update carries authoritative placement */ });
            net.on('round:result', (m) => showRoundResult(m)); // intermission between rounds
            net.on('game:over', (m) => showGameOver(m));     // final round → champion

            net.connect();
            return net;
        }
        function syncHostFlag() { state.isHost = !!(state.room && state.room.hostId === state.playerId); }

        // "Reduce distractions" — mutes the live clear/wipeout/lead-change cues
        // for players who want to focus purely on the board.
        $('fx-toggle').addEventListener('click', () => {
            eventsMuted = !eventsMuted;
            const btn = $('fx-toggle');
            btn.innerText = eventsMuted ? '🔕' : '✨';
            btn.classList.toggle('opacity-50', eventsMuted);
            btn.title = eventsMuted ? 'Race effects off — tap to enable' : 'Race effects on — tap to mute';
            if (eventsMuted) $('race-event-banner').classList.remove('show');
        });

        // ── Create / Join ─────────────────────────────────────────────────────
        function onCreate() {
            const name = requireName(); if (!name) return;
            connStatus.innerText = 'Connecting…';
            ensureNet().request('room:create', { name }).then((res) => {
                if (!res || res.error) { connStatus.innerText = res?.error || 'Failed to create room'; return; }
                state.code = res.code; state.playerId = res.playerId; state.room = res.room;
                syncHostFlag(); renderLobby(); showView('lobby');
            });
        }
        function onJoinToggle() {
            const opening = !joinSection.classList.contains('open');
            joinSection.classList.toggle('open', opening);
            joinToggle.style.opacity = opening ? '0.6' : '1';
            if (opening) {
                if (!requireName()) { joinSection.classList.remove('open'); joinToggle.style.opacity = '1'; return; }
                setTimeout(() => codeInput.focus(), 200);
            }
        }
        function onJoinConfirm() {
            const name = requireName(); if (!name) return;
            const code = codeInput.value.trim().toUpperCase();
            if (code.length !== 6) { codeError.innerText = 'Enter the 6-character room code'; codeInput.focus(); return; }
            codeError.innerText = '';
            connStatus.innerText = 'Connecting…';
            ensureNet().request('room:join', { code, name }).then((res) => {
                if (!res || res.error) { codeError.innerText = res?.error || 'Failed to join'; return; }
                state.code = res.room.code; state.playerId = res.playerId; state.room = res.room;
                syncHostFlag(); renderLobby(); showView('lobby');
            });
        }
        codeInput.addEventListener('input', () => { codeError.innerText = ''; });
        codeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') onJoinConfirm(); });

        // ── Lobby ─────────────────────────────────────────────────────────────
        function renderLobby() {
            const room = state.room; if (!room) return;
            $('lobby-code').innerText = room.code;
            $('lobby-count').innerText = `${room.players.length} / ${room.maxPlayers}`;
            const filled = room.players.map((p) => {
                const you = p.id === state.playerId;
                const host = p.isHost ? '<span class="text-[9px] font-extrabold px-1.5 py-0.5 rounded-full" style="background:rgba(6,78,59,0.85);color:#d1fae5;">HOST</span>' : '';
                const dot = '<span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-600 mr-2 align-middle"></span>';
                return `<div class="flex items-center justify-between rounded-lg px-3 py-2" style="background:rgba(255,255,255,0.8);">
                    <span class="text-sm font-bold text-emerald-950">${dot}${escapeHtml(p.name)}${you ? ' (you)' : ''}</span>${host}</div>`;
            });
            // Show remaining seats so everyone sees room fill up to 4.
            const empties = [];
            for (let i = room.players.length; i < room.maxPlayers; i++) {
                empties.push(`<div class="flex items-center rounded-lg px-3 py-2 border border-dashed border-emerald-900/25">
                    <span class="text-xs font-semibold text-emerald-900/40 italic">Waiting for a player…</span></div>`);
            }
            $('lobby-players').innerHTML = filled.concat(empties).join('');
            const labels = { lobby: 'Lobby', countdown: 'Starting', active: 'Racing', intermission: 'Intermission', gameover: 'Game Over' };
            $('lobby-status-pill').innerText = labels[room.status] || room.status;
            const inLobby = room.status === 'lobby';
            $('start-btn').classList.toggle('hidden', !(inLobby && state.isHost));
            $('rounds-select').classList.toggle('hidden', !(inLobby && state.isHost));
            $('waiting-msg').classList.toggle('hidden', !(inLobby && !state.isHost));
            $('start-btn').disabled = room.players.length < 1;
            if (inLobby && state.isHost) renderRoundsSelector('rounds-options');
        }
        function onStart() {
            $('start-btn').disabled = true;
            showGenerating();   // instant feedback for the host while the board generates
            net.request('room:start', { rounds: state.rounds }).then((res) => {
                if (res && res.error) { $('start-btn').disabled = false; alert(res.error); }
            });
        }

        // Loader shown from "Start" until the board is ready (countdown begins).
        function showGenerating() {
            const spinner = '<div class="spinner"></div>';
            // Lobby (round 1 / fresh game)
            $('start-btn').classList.add('hidden');
            $('rounds-select').classList.add('hidden');
            $('waiting-msg').classList.add('hidden');
            $('lobby-countdown').classList.remove('hidden');
            const lbl = $('countdown-label'); if (lbl) lbl.innerText = 'Generating puzzle…';
            $('countdown-num').innerHTML = spinner;
            // Race-view overlay (rounds 2+ / play again)
            const rc = $('results-countdown');
            if (rc) rc.innerHTML = `${spinner}<div class="text-xs font-bold text-slate-500">Generating next puzzle…</div>`;
        }

        // ── Countdown ───────────────────────────────────────────────────────
        let countdownTimer = null;
        function startCountdown(startAt) {
            $('lobby-countdown').classList.remove('hidden');
            $('start-btn').classList.add('hidden');
            $('waiting-msg').classList.add('hidden');
            clearInterval(countdownTimer);
            const lbl = $('countdown-label'); if (lbl) lbl.innerText = 'Get ready';  // clear the "Generating…" label
            const tick = () => {
                const remaining = Math.max(0, Math.ceil((startAt - Date.now()) / 1000));
                const ln = $('countdown-num'); if (ln) ln.innerText = remaining > 0 ? String(remaining) : 'GO';
                // Rounds 2+ : the countdown shows inside the results overlay.
                const rc = $('results-countdown');
                if (rc) rc.innerText = remaining > 0 ? `Starting in ${remaining}…` : 'Go!';
                if (remaining <= 0) clearInterval(countdownTimer);
            };
            tick();
            countdownTimer = setInterval(tick, 200);
        }

        // ── Race ────────────────────────────────────────────────────────────
        function onRaceStart() {
            clearInterval(countdownTimer);
            state.finished = false;
            $('race-finish-banner').classList.add('hidden');
            $('race-standings').classList.add('hidden');
            const total = state.board ? state.board.paths.length : 0;
            // Reset live-event tracking for the new round, then seed everyone at 0
            // so bars render immediately and the first real clear is detected.
            leaderId = null;
            for (const k in fx) delete fx[k];
            for (const k in prevCleared) delete prevCleared[k];
            $('race-event-banner').classList.remove('show');
            if (state.room) for (const p of state.room.players) { progress[p.id] = { cleared: 0, total }; prevCleared[p.id] = 0; }
            showView('race');
            $('race-round').innerText = `Round ${state.round || 1}/${state.totalRounds || 1}`;
            startRaceTimer(state.endsAt);

            // Wait a frame so the board container has its layout box before resize measures it.
            setTimeout(() => {
                race = race || new RaceClient();
                race.start(state.board, {
                    onProgress: (cleared, tot) => {
                        applyProgress(state.playerId, cleared, tot);
                        net.send('race:progress', { cleared, total: tot });
                    },
                    onWin: () => {
                        state.finished = true;
                        // Send the clear order so the server can verify the solve.
                        net.request('race:finished', { order: race.clearOrder() }).then((res) => {
                            if (res && res.placement) showFinishBanner(`You finished #${res.placement}! 🎉`);
                            else if (res && res.error) showFlash('⚠️ Finish not accepted — please keep racing.');
                        });
                    },
                    onRetry: () => {
                        // Out of lives — board reset to the start; opponents see the bar drop.
                        const tot = race.total();
                        applyProgress(state.playerId, 0, tot);
                        net.send('race:progress', { cleared: 0, total: tot });
                        showFlash('💔 Out of lives — board reset! Solve it again.');
                    },
                });
                renderOpponents();
            }, 60);
        }

        // Single entry point for every progress update (yours and opponents').
        // Reads the drama out of the numbers — a clear (count went up), a wipeout
        // (count dropped to 0 = out of lives), a lead change — then redraws the
        // strip. All cues stay on the strip / top edge; the board is never touched.
        function applyProgress(playerId, cleared, total) {
            const prev = prevCleared[playerId];
            progress[playerId] = { cleared, total };

            if (prev != null && !eventsMuted && state.room && !state.finished) {
                const you = playerId === state.playerId;
                if (cleared > prev) {
                    fx[playerId] = 'pulse';                       // made progress
                } else if (prev > 0 && cleared === 0) {
                    fx[playerId] = 'wipeout';                     // out of lives — board reset
                    if (!you) {
                        const p = state.room.players.find((q) => q.id === playerId);
                        showEventBanner(`💥 ${escapeHtml((p && p.name) || 'Someone')} wiped out!`);
                    }
                }
            }
            prevCleared[playerId] = cleared;

            renderOpponents();
            if (prev != null) checkLeadChange();
        }

        // Front-runner = most pieces cleared. Announces ONLY a real, non-tied
        // change to a new leader, so it can never spam. The first leader is
        // recorded silently (no banner for "0 → someone's ahead at the start").
        function checkLeadChange() {
            if (eventsMuted || !state.room || state.finished) return;
            let best = null, bestN = -1, tie = false;
            for (const p of state.room.players) {
                const n = (progress[p.id] || {}).cleared || 0;
                if (n > bestN) { bestN = n; best = p.id; tie = false; }
                else if (n === bestN) tie = true;
            }
            if (bestN <= 0 || tie || best === leaderId) return;
            const wasSet = leaderId != null;
            leaderId = best;
            if (!wasSet) return;
            const p = state.room.players.find((q) => q.id === best);
            showEventBanner(best === state.playerId
                ? '🚀 You took the lead!'
                : `⚡ ${escapeHtml((p && p.name) || 'Someone')} took the lead!`);
        }

        // Small auto-fading banner at the top edge. pointer-events-none, so it
        // never blocks a tap on the board beneath it.
        let eventBannerT = null;
        function showEventBanner(text) {
            const b = $('race-event-banner');
            b.innerHTML = text;
            b.classList.add('show');
            clearTimeout(eventBannerT);
            eventBannerT = setTimeout(() => b.classList.remove('show'), 1400);
        }

        // Compact shared "race track": one line, each player a marker positioned
        // by their solve % → rightmost is ahead. Finishers show their place; you
        // are highlighted. Takes far less room than a bar per player.
        function renderOpponents() {
            const el = $('race-opponents');
            if (!state.room) { el.innerHTML = ''; return; }
            const total = state.board ? state.board.paths.length : 0;

            const markers = state.room.players.map((p) => {
                const you = p.id === state.playerId;
                const pr = progress[p.id] || { cleared: 0, total };
                const pct = Math.max(0, Math.min(100, pr.total ? Math.round((pr.cleared / pr.total) * 100) : 0));
                const out = p.status === 'dnf' || p.status === 'disconnected';
                const done = p.placement != null;
                const bg = you ? '#10b981' : done ? '#f59e0b' : '#64748b';
                const face = done ? `#${p.placement}` : escapeHtml((p.name || '?').trim().slice(0, 1).toUpperCase());
                // Transient effect for this marker (pulse on clear, shake on wipeout).
                const effect = fx[p.id] === 'wipeout' ? 'fx-wipeout' : fx[p.id] === 'pulse' ? 'fx-pulse' : '';
                // Map 0..100% across the track, keeping markers clear of both
                // edges and the finish flag.
                const left = `calc((100% - 44px) * ${out ? 0 : pct} / 100 + 16px)`;
                return `<div class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 transition-all duration-300 ${out ? 'opacity-40' : ''}"
                             style="left:${left}; z-index:${you ? 6 : done ? 4 : 2};" title="${escapeHtml(p.name)}${you ? ' (you)' : ''} — ${out ? 'left' : done ? '#' + p.placement : pct + '%'}">
                        <div class="w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-extrabold text-white shadow-md ${you ? 'ring-2 ring-white' : ''} ${effect}"
                             style="background:${bg};">${face}</div>
                    </div>`;
            }).join('');

            // Effects are one-shot — consume them so the next render doesn't replay.
            for (const k in fx) delete fx[k];

            el.innerHTML = `
                <div class="relative w-full h-8 bg-white/85 backdrop-blur rounded-full shadow-sm px-1">
                    <div class="absolute left-3 right-8 top-1/2 -translate-y-1/2 h-1 rounded-full bg-slate-200"></div>
                    <div class="absolute right-2 top-1/2 -translate-y-1/2 text-sm">🏁</div>
                    ${markers}
                </div>`;
        }

        // ── Race countdown timer ──────────────────────────────────────────────
        let raceTimerInterval = null;
        function startRaceTimer(endsAt) {
            clearInterval(raceTimerInterval);
            const el = $('race-timer');
            if (!endsAt) { el.innerText = ''; return; }
            const tick = () => {
                const ms = Math.max(0, endsAt - Date.now());
                const s = Math.ceil(ms / 1000);
                el.innerText = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
                el.classList.toggle('text-rose-600', ms <= 10000);  // last 10s → red
                el.classList.toggle('text-slate-700', ms > 10000);
                if (ms <= 0) clearInterval(raceTimerInterval);
            };
            tick();
            raceTimerInterval = setInterval(tick, 250);
        }

        function showFinishBanner(text) {
            const b = $('race-finish-banner');
            clearTimeout(b._t);            // don't let a transient flash hide the finish banner
            b.innerText = text; b.classList.remove('hidden');
        }

        // Transient banner that auto-hides (e.g. the out-of-lives reset notice).
        function showFlash(text, ms = 2000) {
            const b = $('race-finish-banner');
            b.innerText = text; b.classList.remove('hidden');
            clearTimeout(b._t);
            b._t = setTimeout(() => b.classList.add('hidden'), ms);
        }

        // Renders a clean snapshot of a round's puzzle (every arrow in its start
        // position) to a data URL for the results screen. Drawn from board data —
        // not the live canvas, which is zoomed-in and cleared by round end — so it
        // always shows the WHOLE puzzle. Mirrors the in-game look: navy paths +
        // arrowheads on a white board.
        function boardThumbnail(board, maxW = 240, maxH = 240) {
            if (!board || !Array.isArray(board.paths) || !board.gridRows || !board.gridCols) return '';
            const gR = board.gridRows, gC = board.gridCols, pad = 6;
            const cell = Math.max(1, Math.min((maxW - pad * 2) / gC, (maxH - pad * 2) / gR));
            const w = Math.round(gC * cell + pad * 2), h = Math.round(gR * cell + pad * 2);
            const dpr = window.devicePixelRatio || 1;

            const cv = document.createElement('canvas');
            cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
            const ctx = cv.getContext('2d');
            ctx.scale(dpr, dpr);
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);

            const X = (c) => pad + c * cell, Y = (r) => pad + r * cell;
            const NAVY = '#112540';
            ctx.lineJoin = 'round'; ctx.lineCap = 'round';
            ctx.lineWidth = Math.max(1.2, cell * 0.16);
            ctx.strokeStyle = NAVY; ctx.fillStyle = NAVY;

            const HD = { UP: [0, -1], DOWN: [0, 1], LEFT: [-1, 0], RIGHT: [1, 0] };
            for (const p of board.paths) {
                const ns = p.nodes;
                if (!ns || ns.length < 2) continue;
                ctx.beginPath();
                ctx.moveTo(X(ns[0].c), Y(ns[0].r));
                for (let i = 1; i < ns.length; i++) ctx.lineTo(X(ns[i].c), Y(ns[i].r));
                ctx.stroke();

                // Arrowhead at the head node, pointing along the path's heading.
                const head = ns[ns.length - 1];
                const [vx, vy] = HD[p.heading] || [1, 0];
                const px = -vy, py = vx;                 // perpendicular
                const hx = X(head.c), hy = Y(head.r), a = Math.max(2.5, cell * 0.55);
                ctx.beginPath();
                ctx.moveTo(hx + vx * a * 0.6, hy + vy * a * 0.6);
                ctx.lineTo(hx - vx * a * 0.4 + px * a * 0.5, hy - vy * a * 0.4 + py * a * 0.5);
                ctx.lineTo(hx - vx * a * 0.4 - px * a * 0.5, hy - vy * a * 0.4 - py * a * 0.5);
                ctx.closePath();
                ctx.fill();
            }
            return cv.toDataURL('image/png');
        }

        // <img> markup for a round's puzzle snapshot (empty string if unavailable).
        function puzzleSnapMarkup() {
            const src = boardThumbnail(state.board);
            if (!src) return '';
            return `<img src="${src}" alt="This round's puzzle"
                 class="rounded-xl shadow-md border border-slate-200 w-auto max-w-[220px] max-h-[40vh] object-contain" />`;
        }

        // Cumulative game leaderboard (points + rounds won), highlighting you/champions.
        function standingsList(standings) {
            const medal = (i) => ['🥇', '🥈', '🥉'][i] || '';
            return (standings || []).map((s, i) => {
                const you = s.id === state.playerId;
                const champ = s.isChampion ? ' 👑' : '';
                return `<div class="flex items-center justify-between rounded-lg px-3 py-2 ${you ? 'bg-emerald-50 border border-emerald-200' : 'bg-slate-50'}">
                    <span class="text-sm font-bold text-slate-800">${medal(i)} ${escapeHtml(s.name)}${you ? ' (you)' : ''}${champ}</span>
                    <span class="text-sm font-extrabold text-slate-700">${s.gamePoints} pts<span class="text-[11px] font-semibold text-slate-400 ml-1.5">${s.roundsWon}w</span></span>
                </div>`;
            }).join('');
        }

        // Between rounds — show standings + a countdown to the next round.
        function showRoundResult(m) {
            clearInterval(raceTimerInterval);
            state.round = m.round; state.totalRounds = m.totalRounds;
            $('race-standings').innerHTML =
                `<div class="text-xs font-extrabold text-emerald-600 uppercase tracking-widest">Round ${m.round} of ${m.totalRounds} complete</div>
                 ${puzzleSnapMarkup()}
                 <h3 class="text-xl font-extrabold text-slate-800 tracking-tight">Standings</h3>
                 <div class="w-full max-w-xs space-y-1.5">${standingsList(m.standings)}</div>
                 <div id="results-countdown" class="text-sm font-bold text-slate-500 mt-1">Next round starting soon…</div>`;
            $('race-standings').classList.remove('hidden');
        }

        // Final round done — crown the champion(s); host can start another game here.
        function showGameOver(m) {
            clearInterval(raceTimerInterval); clearInterval(countdownTimer);
            state.finished = true;
            if (race && race.audio) race.audio.playFanfare();   // celebratory leaderboard chime
            const champs = (m.champions || []).map((c) => escapeHtml(c.name)).join(' & ') || '—';
            const many = m.champions && m.champions.length > 1;
            const host = state.isHost;
            $('race-standings').innerHTML =
                `<div class="text-4xl">🏆</div>
                 <div class="text-xs font-extrabold text-amber-500 uppercase tracking-widest">Champion${many ? 's' : ''}</div>
                 <h3 class="text-2xl font-extrabold text-slate-800 tracking-tight">${champs}</h3>
                 ${puzzleSnapMarkup()}
                 <div class="w-full max-w-xs space-y-1.5">${standingsList(m.standings)}</div>
                 ${host
                    ? `<div class="w-full max-w-xs mt-1">
                         <div class="text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1.5 text-center">Play again — rounds</div>
                         <div id="gameover-rounds" class="flex gap-2 mb-2"></div>
                         <button onclick="onStart()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm rounded-xl glow-btn">Play Again</button>
                       </div>`
                    : `<div class="text-sm font-semibold text-slate-500 mt-1">Waiting for the host to start a new game…</div>`}
                 <div id="results-countdown" class="text-sm font-bold text-emerald-600"></div>
                 <button onclick="leaveRoom()" class="text-xs font-bold text-slate-400 hover:text-slate-600 mt-1">← Leave room</button>`;
            $('race-standings').classList.remove('hidden');
            if (host) renderRoundsSelector('gameover-rounds');
        }

        // ── Misc ────────────────────────────────────────────────────────────
        function copyCode() {
            const code = state.room && state.room.code;
            if (!code) return;
            const flash = () => { const btn = $('copy-btn'); btn.innerText = 'Copied!'; setTimeout(() => { btn.innerText = 'Copy code'; }, 1200); };
            // execCommand fallback for non-secure contexts (file://, http LAN IP)
            // where navigator.clipboard is unavailable.
            const fallback = () => {
                const ta = document.createElement('textarea');
                ta.value = code;
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed';
                ta.style.top = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                ta.setSelectionRange(0, code.length);
                let ok = false;
                try { ok = document.execCommand('copy'); } catch (_) { }
                document.body.removeChild(ta);
                ok ? flash() : prompt('Copy this room code:', code);
            };
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(code).then(flash).catch(fallback);
            } else {
                fallback();
            }
        }

        function leaveRoom() {
            if (net) net.send('room:leave');
            if (race) race.stop();
            clearInterval(countdownTimer);
            clearInterval(raceTimerInterval);
            for (const k in progress) delete progress[k];
            state.code = state.playerId = state.room = state.board = null;
            state.isHost = false; state.finished = false;
            $('lobby-countdown').classList.add('hidden');
            $('race-standings').classList.add('hidden');
            $('race-finish-banner').classList.add('hidden');
            showView('entry');
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        // Shareable invite link: ?join=CODE prefills the join flow.
        (function initInvite() {
            const join = params.get('join');
            if (join && /^[A-Z0-9]{6}$/i.test(join)) {
                joinSection.classList.add('open');
                codeInput.value = join.toUpperCase();
                if (!nameInput.value) nameInput.focus();
            }
        })();
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
                    .catch((err) => console.warn('[SW] Registration failed:', err));
            });
        }
    </script>
</body>

</html>
