<!DOCTYPE html>
<html lang="en" style="height:-webkit-fill-available;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="VECTO">
    <meta name="theme-color" content="#ffffff">
    <title>VECTO</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
    <script src="vendor/tailwind.js"></script>
    <script src="js/ui-sound.js"></script>
    <style>
        @import url('vendor/fonts/fonts.css');

        html, body { height: 100%; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #0f172a;
            user-select: none; -webkit-user-select: none;
            min-height: 100svh; min-height: -webkit-fill-available;
            background: #ffffff;
        }
        /* Fixed, clipped background so the animations never clip the content
           or break vertical scrolling on short/landscape screens. */
        .bg-fx { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }

        /* Static gradient wordmark */
        .wordmark {
            background: linear-gradient(100deg, #f59e0b, #ec4899 50%, #8b5cf6 92%);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; color: transparent;
        }

        /* Background dot-grid (echoes the board) + rising arrows */
        .grid-pan { position:absolute; inset:-40px; z-index:0; pointer-events:none;
            background-image: radial-gradient(circle, rgba(15,23,42,.06) 1.5px, transparent 1.5px);
            background-size: 26px 26px; animation: pan 22s linear infinite;
            -webkit-mask-image: radial-gradient(130% 95% at 50% 35%, #000 35%, transparent 82%);
                    mask-image: radial-gradient(130% 95% at 50% 35%, #000 35%, transparent 82%); }
        .spark { position:absolute; bottom:-30px; z-index:0; opacity:0; animation: rise linear infinite; }
        @keyframes pan  { from { background-position: 0 0 } to { background-position: 0 -520px } }
        @keyframes rise { 0% { transform: translateY(0) scale(.8); opacity:0 }
                          12% { opacity:.55 } 80% { opacity:.4 }
                          100% { transform: translateY(-88vh) scale(1.05); opacity:0 } }

        /* Press feedback only — no ambient animation */
        .game-card { transition: transform .15s ease; }
        .game-card:active { transform: scale(.985) translateY(1px); }
        .glow-btn { transition: transform .12s ease; }
        .glow-btn:active { transform: scale(.96); }

        .sheen { position:absolute; inset:0; border-radius:inherit; pointer-events:none;
                 background: linear-gradient(140deg, rgba(255,255,255,.35), rgba(255,255,255,0) 42%); }
    </style>
</head>
<body class="flex flex-col items-center"
      style="padding: max(20px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));">

    <!-- Background: dot-grid + rising arrows (fixed + clipped, never affects layout) -->
    <div class="bg-fx">
    <div class="grid-pan"></div>
    <svg class="spark" style="left:14%; animation-duration:9s;  animation-delay:0s;"   width="18" height="18" fill="none" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    <svg class="spark" style="left:38%; animation-duration:11s; animation-delay:2.5s;" width="14" height="14" fill="none" stroke="#d946ef" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    <svg class="spark" style="left:64%; animation-duration:8s;  animation-delay:1.2s;" width="16" height="16" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    <svg class="spark" style="left:82%; animation-duration:12s; animation-delay:4s;"   width="13" height="13" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    <svg class="spark" style="left:26%; animation-duration:10s; animation-delay:5.5s;" width="15" height="15" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </div>

    <div class="relative z-10 my-auto w-full max-w-sm flex flex-col items-center gap-5">

        <!-- Logo -->
        <div class="flex items-center gap-2">
            <svg class="w-7 h-7 md:w-8 md:h-8 text-[#0f172a]" fill="none" stroke="currentColor"
                 stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <path d="m3 3 7.07 16.97 2.51-7.39 7.39-2.51L3 3z" />
                <path d="m13 13 6 6" />
            </svg>
            <h1 class="wordmark text-5xl md:text-6xl font-extrabold tracking-tighter leading-none">VECTO</h1>
        </div>

        <!-- Play with Friends Card -->
        <div class="game-card relative w-full rounded-[26px] p-5 overflow-hidden"
             style="background: linear-gradient(140deg, #1e40af 0%, #0284c7 52%, #38bdf8 100%);
                    box-shadow: 0 20px 44px -16px rgba(2,132,199,.6), inset 0 1px 0 rgba(255,255,255,.25);">
            <div class="sheen"></div>
            <div class="relative flex items-start justify-between">
                <div>
                    <span class="text-[10px] font-extrabold text-white/50 uppercase tracking-[0.18em]">Play with Friends</span>
                    <div class="mt-1 text-2xl font-extrabold text-white tracking-tight leading-tight">Race up to<br>4 Players</div>
                </div>
                <div class="shrink-0 w-12 h-12 rounded-2xl bg-white/10 flex items-center justify-center text-2xl shadow-inner">👥</div>
            </div>
            <p class="relative mt-2 text-[13px] text-white/65 font-semibold leading-snug">Create a room or join with a code — first to solve wins.</p>
            <button id="friends-play-btn" onclick="goFriends()"
                class="relative glow-btn mt-4 w-full py-3.5 font-extrabold text-[15px] rounded-2xl tracking-wide flex items-center justify-center gap-2"
                style="background: #0c4a6e; color: #ffffff; box-shadow: 0 8px 18px -6px rgba(12,74,110,.6);">
                Create or Join a Room
                <span class="text-lg leading-none">→</span>
            </button>
        </div>

        <!-- Level Play Card -->
        <div class="game-card relative w-full rounded-[26px] p-5 overflow-hidden"
             style="background: #d97706;
                    box-shadow: 0 20px 44px -16px rgba(217,119,6,.6), inset 0 1px 0 rgba(255,255,255,.35);">
            <div class="sheen"></div>
            <div class="relative flex items-start justify-between">
                <div class="min-w-0">
                    <span class="text-[10px] font-extrabold text-white/65 uppercase tracking-[0.18em]">Level Play</span>
                    <div id="level-play-status" class="mt-1 text-2xl font-extrabold text-white tracking-tight leading-tight truncate"></div>
                    <div id="level-play-score" class="text-[13px] font-semibold mt-0.5 text-white/80"></div>
                </div>
                <div class="shrink-0 w-12 h-12 rounded-2xl bg-white/15 flex items-center justify-center text-2xl shadow-inner">⚡</div>
            </div>
            <button onclick="goNormal()"
                class="relative glow-btn mt-4 w-full py-3.5 font-extrabold text-[15px] rounded-2xl tracking-wide flex items-center justify-center gap-2"
                style="background: #92400e; color: #ffffff; box-shadow: 0 8px 18px -6px rgba(120,53,15,.55);">
                <span id="level-play-cta">Continue Playing</span>
                <span class="text-lg leading-none">→</span>
            </button>
        </div>

    </div>

    <script>
        // Read localStorage directly — no game JS needed on the splash page.
        const SAVE_KEY  = 'vecto_colossal_mosaic_save_v5';
        try {
            const raw  = localStorage.getItem(SAVE_KEY);
            const save = raw ? JSON.parse(raw) : null;
            if (save && save.level) {
                document.getElementById('level-play-status').innerText = `Level ${save.level}`;
                document.getElementById('level-play-score').innerText  = `${save.score || 0} pts · pick up where you left off`;
                document.getElementById('level-play-cta').innerText    = 'Continue Playing';
            } else {
                document.getElementById('level-play-status').innerText = 'New Game';
                document.getElementById('level-play-score').innerText  = 'Begin from Level 1';
                document.getElementById('level-play-cta').innerText    = 'Start Playing';
            }
        } catch (e) {
            document.getElementById('level-play-status').innerText = 'New Game';
            document.getElementById('level-play-cta').innerText    = 'Start Playing';
        }

        function goFriends() { window.location.href = 'friends.html'; }
        function goNormal()  { window.location.href = 'game.html'; }
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                let isFirstInstall = !navigator.serviceWorker.controller;
                navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
                    .then(reg => { console.log('[SW] Registered:', reg.scope); reg.update(); })
                    .catch(err => console.warn('[SW] Registration failed:', err));
                let refreshing = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (refreshing) return;
                    if (isFirstInstall) { isFirstInstall = false; return; }
                    refreshing = true;
                    window.location.reload();
                });
            });
        }
    </script>
</body>
</html>
