<!DOCTYPE html>
<html lang="en" style="height:-webkit-fill-available;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="VECTO">
    <meta name="theme-color" content="#0f172a">
    <title>VECTO: Colossal Mosaic Edition</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            user-select: none;
            -webkit-user-select: none;
            height: 100svh !important;
            min-height: -webkit-fill-available;
        }
        .glow-btn:active { transform: scale(0.96); }
    </style>
</head>
<body class="w-screen flex flex-col justify-center items-center p-4 gap-3 md:gap-4 bg-slate-100"
      style="padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));">

    <!-- Logo -->
    <div class="text-center">
        <div class="text-2xl md:text-3xl font-extrabold text-[#112540] tracking-tight">VECTO</div>
        <div class="text-[9px] md:text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">Colossal Mosaic Edition</div>
    </div>

    <!-- Daily Puzzle Card -->
    <div class="w-full max-w-sm rounded-2xl p-4 md:p-5 shadow-xl"
         style="background: linear-gradient(135deg, #fde68a 0%, #fbbf24 45%, #f59e0b 100%);">
        <div class="flex items-center justify-between mb-1.5">
            <span class="text-[9px] font-extrabold text-amber-900/60 uppercase tracking-widest">Daily Puzzle</span>
            <span class="text-sm">☀️</span>
        </div>
        <div id="daily-date-display" class="text-sm font-extrabold text-amber-900 tracking-tight leading-snug"></div>
        <div id="daily-best-display" class="text-xs text-amber-800/70 font-medium mt-0.5"></div>
        <button id="daily-play-btn" onclick="goDaily()"
            class="mt-3 w-full py-2.5 font-bold text-sm rounded-xl tracking-wide transition-all duration-200 glow-btn"
            style="background: rgba(120,53,15,0.75); color: #fef3c7;">
            Play Today's Puzzle →
        </button>
    </div>

    <!-- Level Play Card -->
    <div class="w-full max-w-sm rounded-2xl p-4 md:p-5 shadow-xl"
         style="background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 45%, #4338ca 100%);">
        <div class="flex items-center justify-between mb-1.5">
            <span class="text-[9px] font-extrabold text-blue-100/70 uppercase tracking-widest">Level Play</span>
            <span class="text-sm">⚡</span>
        </div>
        <div id="level-play-status" class="text-sm font-extrabold text-white tracking-tight leading-snug"></div>
        <div id="level-play-score" class="text-xs font-medium mt-0.5" style="color: rgba(219,234,254,0.75);"></div>
        <button onclick="goNormal()"
            class="mt-3 w-full py-2.5 font-bold text-sm rounded-xl tracking-wide transition-all duration-200 glow-btn border"
            style="background: rgba(255,255,255,0.18); color: #fff; border-color: rgba(255,255,255,0.28);">
            Continue Playing →
        </button>
    </div>

    <script>
        // Read localStorage directly — no game JS needed on the splash page.
        const SAVE_KEY  = 'vecto_colossal_mosaic_save_v5';
        const DAILY_KEY = 'vecto_daily_puzzle_v1';

        function getToday() {
            const d = new Date();
            return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
        }
        function formatDate() {
            return new Date().toLocaleDateString(undefined,
                { weekday:'long', year:'numeric', month:'long', day:'numeric' });
        }

        // Populate Daily card
        document.getElementById('daily-date-display').innerText = formatDate();
        try {
            const raw = localStorage.getItem(DAILY_KEY);
            const daily = raw ? JSON.parse(raw) : null;
            const todayKey = String(getToday());
            if (daily && daily.date === todayKey && daily.bestScore !== undefined) {
                document.getElementById('daily-best-display').innerText =
                    `Best today: ${daily.bestScore} pts`;
                document.getElementById('daily-play-btn').innerText = 'Play Again →';
            } else {
                document.getElementById('daily-best-display').innerText =
                    'Fresh puzzle — no attempts yet';
            }
        } catch (e) {}

        // Populate Level Play card
        try {
            const raw  = localStorage.getItem(SAVE_KEY);
            const save = raw ? JSON.parse(raw) : null;
            if (save && save.level) {
                document.getElementById('level-play-status').innerText = `Level ${save.level}`;
                document.getElementById('level-play-score').innerText  =
                    `${save.score || 0} pts · continue where you left off`;
            } else {
                document.getElementById('level-play-status').innerText = 'Start Fresh';
                document.getElementById('level-play-score').innerText  =
                    'No saved progress — begin from Level 1';
            }
        } catch (e) {
            document.getElementById('level-play-status').innerText = 'Start Fresh';
        }

        function goDaily()  { window.location.href = 'daily.html'; }
        function goNormal() { window.location.href = 'game.html'; }
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // Guard to prevent reload on initial install
                let isFirstInstall = !navigator.serviceWorker.controller;

                navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
                    .then(reg => {
                        console.log('[SW] Registered:', reg.scope);
                        // Proactively check for updates on load
                        reg.update();
                    })
                    .catch(err => console.warn('[SW] Registration failed:', err));

                let refreshing = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (refreshing) return;
                    if (isFirstInstall) {
                        isFirstInstall = false;
                        return;
                    }
                    refreshing = true;
                    window.location.reload();
                });
            });
        }
    </script>
</body>
</html>
